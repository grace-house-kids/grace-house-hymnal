<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bible Maze</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #111;
    color: #777;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  #wrap {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  #view {
    display: block;
    image-rendering: pixelated;
    max-width: 96vw;
    max-height: 82vh;
    touch-action: none;
  }
  #hud {
    font-size: 13px;
    letter-spacing: 1px;
    color: #666;
    text-align: center;
    line-height: 1.5;
  }
  #hud b { color: #cfa; }
  #veil {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.72);
    color: #fff;
    font-size: 22px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    z-index: 5;
  }
  #veil.hidden { display: none; }
  #veil small { display: block; margin-top: 8px; font-size: 14px; letter-spacing: 3px; text-transform: none; }
  #veil small:empty { display: none; }
  #veil span {
    padding: 14px 26px 16px;
    border: 2px solid #fff;
    background: #222;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="view" width="320" height="200" tabindex="0"></canvas>
  <div id="hud">
    <b>W</b>/<b>S</b> move &nbsp; <b>A</b>/<b>D</b> strafe &nbsp; <b>&larr;</b>/<b>&rarr;</b> turn &nbsp; <b>&uarr;</b>/<b>&darr;</b> look &nbsp; <b>SPACE</b> open &nbsp;|&nbsp; <b>drag</b> move/turn &nbsp; <b>tap</b> open &nbsp;|&nbsp; <b>M</b> mute &nbsp; <b>ESC</b> menu
  </div>
</div>
<div id="veil"><span>Tap / click to play<small id="vpass"></small></span></div>

<script>
/* ============================================================================
   Catacomb Audio engine (v1 + Bass/Bright update) — inlined so the game stays
   ONE self-contained file. Source: catacomb-audio.js, verbatim, except the
   closing script tags in its header-comment examples are backslash-escaped so
   the HTML parser reads on.
   ============================================================================ */
/*!
 * Catacomb Audio v1 — procedural dungeon-music engine
 * Web Audio API, zero dependencies. ~8KB raw / ~4KB minified+gzipped.
 *
 * ---------------------------------------------------------------------------
 * QUICK START
 * ---------------------------------------------------------------------------
 *   <\script src="catacomb-audio.js"><\/script>
 *   <\script>
 *     const audio = new CatacombEngine();
 *
 *     // Define your level palettes once (matches the generator's controls):
 *     audio.load({
 *       ink_and_bone: { M:'Phrygian', Root:'E', Tempo:78, Seed:'Random',
 *                       Intensity:'Frenzied', Choir:'On', Lyre:'Cascading', Loop:true },
 *       still_water:  { M:'Aeolian',  Root:'A', Tempo:64, Intensity:'Sparse',
 *                       Choir:'Off',  Lyre:'Rare', Loop:true },
 *       // Castlevania-flavoured: fast, Harmonic Minor, galloping bass, bright square lead
 *       night_hunt:   { M:'Harmonic Minor', Root:'E', Tempo:148, Intensity:'Frenzied',
 *                       Bass:'Gallop', Bright:'On', Choir:'Off', Lyre:'Sparse', Loop:true },
 *     });
 *
 *     // Then just hand it the variable your game is already tracking.
 *     // NOTE: browsers only allow audio to start after a user gesture
 *     // (a click / keypress), so call play() from inside one.
 *     startButton.onclick = () => audio.play(level_palette); // e.g. 'ink_and_bone'
 *   <\/script>
 *
 * ---------------------------------------------------------------------------
 * PALETTE FIELDS  (keys are case-insensitive; long or short names both work)
 * ---------------------------------------------------------------------------
 *   M / mode / scale : 'Phrygian','Aeolian','Dorian','Locrian',
 *                      'Phrygian Dominant','Harmonic Minor','Hungarian Minor'
 *   Root             : 'E', 'C#', 'Ab' ... (or 0–11)
 *   Intervals        : OPTIONAL override, e.g. '0 1 3 5 7 8 10' or [0,1,3,5,7,8,10]
 *                      (define any custom scale; if given, it wins over M)
 *   Tempo            : BPM number (30–240)
 *   Seed             : 'Random', or a fixed number for a reproducible track
 *   Intensity        : 'Sparse' | 'Balanced' | 'Frenzied'   (or a number, 1 = normal)
 *   Choir            : 'On' | 'Off' | true | false
 *   Lyre             : 'Off' | 'Rare' | 'Sparse' | 'Woven' | 'Cascading' (or a number)
 *   Bass             : 'Pedal' (dungeon drone, default) | 'Gallop' (driving octave arpeggio)
 *   Bright           : 'On' | 'Off'  — opens the low-pass and switches the lead to a square/pulse wave
 *   Loop             : true | false
 *   arrangement      : OPTIONAL array of 'verse'/'chorus'/'bridge' section names
 *
 * ---------------------------------------------------------------------------
 * API
 * ---------------------------------------------------------------------------
 *   new CatacombEngine({ volume?: 0..1 })
 *   .define(name, palette)          register one palette
 *   .load({ name: palette, ... })   register several
 *   .play(name | palette, { fadeIn?, }) start (stops any current track first)
 *   .stop({ fade? })                fade out and halt
 *   .setVolume(0..1)                live master volume
 *   .unlock()                       create/resume the audio context (call on first gesture)
 *   .isPlaying   (bool)   .playing  (current palette name or null)
 *   CatacombEngine.SCALES / .NOTES  reference tables
 */
(function (global) {
  'use strict';

  /* ---------------- data ---------------- */
  var NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  var SCALES = {
    phrygian:         {name:'Phrygian',          iv:[0,1,3,5,7,8,10]},
    aeolian:          {name:'Aeolian',           iv:[0,2,3,5,7,8,10]},
    dorian:           {name:'Dorian',            iv:[0,2,3,5,7,9,10]},
    locrian:          {name:'Locrian',           iv:[0,1,3,5,6,8,10]},
    phrygiandominant: {name:'Phrygian Dominant', iv:[0,1,4,5,7,8,10]},
    phrygiandom:      {name:'Phrygian Dominant', iv:[0,1,4,5,7,8,10]},
    harmonicminor:    {name:'Harmonic Minor',    iv:[0,2,3,5,7,8,11]},
    hungarianminor:   {name:'Hungarian Minor',   iv:[0,2,3,6,7,8,11]},
    hungarian:        {name:'Hungarian Minor',   iv:[0,2,3,6,7,8,11]}
  };

  var STEPS_PER_BAR = 16, BARS_PER_SECTION = 4, SPS = 64;
  var ARRANGEMENT = ['verse','verse','chorus','verse','chorus','bridge','chorus','chorus'];
  var ROOTSHIFT = { verse:0, chorus:0, bridge:7 };
  var CHOIR_RHYTHM = [ {s:0,d:2,v:1.00}, {s:3,d:4,v:0.85}, {s:8,d:2,v:1.00}, {s:10,d:2,v:0.80} ];
  var PROFILES = {
    verse:  {density:0.40, base:1, span:5, len:2, drumBusy:0.42, syncop:0.18},
    chorus: {density:0.54, base:2, span:7, len:2, drumBusy:0.70, syncop:0.32},
    bridge: {density:0.44, base:1, span:8, len:2, drumBusy:0.40, syncop:0.55}
  };
  var INTENSITY = { sparse:0.72, balanced:1, frenzied:1.32 };
  var LYRE = { off:null, rare:0.45, sparse:0.85, woven:1.15, cascading:1.6 };

  /* ---------------- helpers ---------------- */
  function clamp(v,lo,hi){ return v<lo?lo:v>hi?hi:v; }
  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

  function parseIntervals(v){
    if (Array.isArray(v)) return v.slice();
    if (typeof v === 'string'){ var a=v.split(/[\s,]+/).filter(function(x){return x!=='';}).map(Number); return a.length?a:null; }
    return null;
  }
  function parseRoot(r){
    if (r==null) return 4;
    if (typeof r==='number') return ((r%12)+12)%12;
    var s=String(r).trim().toUpperCase().replace('♯','#').replace('♭','B');
    var i=NOTES.indexOf(s); if (i>=0) return i;
    var flats={DB:1,EB:3,GB:6,AB:8,BB:10,CB:11,FB:4};
    return (s in flats)?flats[s]:4;
  }
  function truthy(v){ if(typeof v==='boolean')return v; if(typeof v==='number')return v!==0; if(v==null)return false; return /^(on|true|yes|1)$/i.test(String(v).trim()); }
  function offish(v){ return /^(off|false|no|none|0)$/i.test(String(v).trim()); }

  function normalize(cfg){
    cfg = cfg || {};
    function pick(){ for(var i=0;i<arguments.length;i++){ if(cfg[arguments[i]]!=null) return cfg[arguments[i]]; } }
    var modeVal = pick('mode','M','scale');
    var modeKey = String(modeVal!=null?modeVal:'phrygian').toLowerCase().replace(/[^a-z]/g,'');
    var iv = parseIntervals(pick('intervals','Intervals')) || (SCALES[modeKey]||SCALES.phrygian).iv.slice();
    var inten = pick('intensity','Intensity');
    var moodMul = (typeof inten==='number') ? inten : (INTENSITY[String(inten||'balanced').toLowerCase()]||1);
    var lyreRaw = pick('lyre','Lyre'), lyreOn=true, lyreDensity=1;
    if (typeof lyreRaw==='number'){ lyreDensity=lyreRaw; }
    else if (lyreRaw!=null){
      var lk=String(lyreRaw).toLowerCase().trim();
      if (lk in LYRE){ if(LYRE[lk]==null) lyreOn=false; else lyreDensity=LYRE[lk]; }
      else if (offish(lk)) lyreOn=false;
    }
    var choirRaw = pick('choir','Choir');
    var seedRaw = pick('seed','Seed');
    var seed = (seedRaw!=null && !/^rand/i.test(String(seedRaw))) ? ((Number(seedRaw)>>>0)||1) : null;
    var loopRaw = pick('loop','Loop');
    var arr = pick('arrangement');
    var bassRaw = pick('bass','Bass');
    return {
      modeName:  (SCALES[modeKey] && SCALES[modeKey].name) || (modeVal||'Custom'),
      intervals: iv,
      rootIdx:   parseRoot(pick('root','Root')),
      tempo:     clamp(Number(pick('tempo','Tempo')||78), 30, 240),
      moodMul:   moodMul,
      lyreOn:    lyreOn,
      lyreDensity: lyreDensity,
      choirOn:   (choirRaw==null) ? true : truthy(choirRaw),
      bassStyle: /gall/i.test(String(bassRaw||'')) ? 'gallop' : 'pedal',
      bright:    truthy(pick('bright','Bright')),
      seed:      seed,
      loop:      (loopRaw==null) ? true : truthy(loopRaw),
      arrangement: Array.isArray(arr) ? arr.slice() : ARRANGEMENT.slice()
    };
  }

  /* ---------------- generation ---------------- */
  function generateSection(type, secSeed, iv, moodMul, lyreDensity, bassStyle){
    var P = PROFILES[type], N = iv.length;
    var rng  = mulberry32((secSeed>>>0) || 1);                  // melody · drums · lyre
    var brng = mulberry32(((secSeed ^ 0x9e3779b9)>>>0) || 7);   // bass — independent, so style swaps don't disturb the rest
    var mel = new Array(SPS).fill(null), bass = new Array(SPS).fill(null), drums = new Array(SPS).fill(null);
    var deg = P.base, s = 0;

    while (s < SPS){
      var onBeat=s%4===0, strong=s%8===0;
      var p=P.density*moodMul*(onBeat?1.5:(s%2===0?0.85:0.4));
      if (P.syncop && (s%4===3 || s%8===5)) p*=1.7;
      if (rng() < Math.min(p,0.95)){
        deg = clamp(deg + Math.round((rng()*2-1)*2.2), P.base-2, P.base+P.span);
        if (strong){ var oct=Math.round(deg/N)*N; deg=[0,2,4].map(function(d){return d+oct;}).reduce(function(a,b){return Math.abs(b-deg)<Math.abs(a-deg)?b:a;}); }
        else if (type==='bridge' && rng()<0.28){ deg=Math.round(deg/N)*N+1; }
        var dur=Math.max(1,Math.round(P.len*(0.5+rng())));
        mel[s]={deg:deg,dur:dur};
        s += (rng()<0.5?dur:1);
      } else s++;
    }

    // ---- bass (independent RNG so Bass style is orthogonal to the rest) ----
    for (var bb=0; bb<BARS_PER_SECTION; bb++){
      var bb0=bb*STEPS_PER_BAR;
      if (bassStyle==='gallop'){
        var cell=[0,7,0,7, 4,7,4,7];                          // octave-bounce arpeggio, 8ths
        for (var e=0;e<8;e++) bass[bb0+e*2]={deg:cell[e],dur:1.6};
        if (moodMul>1.1){ for(var gs=1;gs<STEPS_PER_BAR;gs+=2){ if(brng()<0.5) bass[bb0+gs]={deg:(brng()<0.5?0:7),dur:1.0}; } }
        if (bb===BARS_PER_SECTION-1){ bass[bb0+12]={deg:4,dur:1.6}; bass[bb0+14]={deg:7,dur:1.0}; }
      } else if (type==='verse'){
        bass[bb0]={deg:0,dur:4}; bass[bb0+4]={deg:0,dur:4};
        bass[bb0+8]={deg:(brng()<0.5?4:0),dur:4}; bass[bb0+12]={deg:0,dur:4};
        if (moodMul>1.1 && brng()<0.5) bass[bb0+14]={deg:4,dur:2};
      } else {
        bass[bb0]={deg:0,dur:8}; bass[bb0+8]={deg:(brng()<0.5?4:0),dur:8};
        if (type==='chorus'){ bass[bb0+4]={deg:0,dur:2}; bass[bb0+12]={deg:4,dur:2}; }
        if (type==='bridge' && brng()<0.5) bass[bb0+6]={deg:2,dur:2};
      }
    }

    for (var bar=0; bar<BARS_PER_SECTION; bar++){
      var b0=bar*STEPS_PER_BAR;
      drums[b0]='kick'; drums[b0+8]='kick';
      if (P.drumBusy>0.35){ drums[b0+4]='hit'; drums[b0+12]='hit'; }
      if (P.drumBusy>0.6 && rng()<0.6) drums[b0+14]='hit';
      if (type==='bridge' && bar===BARS_PER_SECTION-1){ drums[b0+12]='hit';drums[b0+13]='hit';drums[b0+14]='hit';drums[b0+15]='hit'; }
      if (moodMul>1.1){ for(var s2=2;s2<STEPS_PER_BAR;s2+=2){ if(!drums[b0+s2] && rng()<0.55) drums[b0+s2]='tick'; } }
    }

    var lyre = new Array(SPS).fill(null);
    for (var lb=0; lb<BARS_PER_SECTION; lb++){
      var d0=lb*STEPS_PER_BAR;
      var flur=(type==='verse'?0.5:type==='chorus'?0.72:0.6)*lyreDensity;
      if (rng() < Math.min(flur,0.97)){
        var up=rng()<0.62, notes=2+Math.floor(rng()*(2+lyreDensity));
        var d=P.base+4+Math.floor(rng()*3), st=d0+(rng()<0.5?0:8)+(rng()<0.3?2:0);
        for (var k=0;k<notes;k++){
          if (st<d0+STEPS_PER_BAR && !lyre[st]) lyre[st]={deg:d,dur:2};
          st += (lyreDensity>1.2?1:(rng()<0.5?1:2));
          d  += up ? (rng()<0.7?2:1) : -(rng()<0.7?2:1);
        }
      }
      if (rng() < Math.min(0.33*lyreDensity,0.85)){ var ls=d0+(rng()<0.5?7:13); if(!lyre[ls]) lyre[ls]={deg:P.base+6+Math.floor(rng()*3),dur:1}; }
    }
    return { melody:mel, bass:bass, drums:drums, lyre:lyre };
  }

  /* ---------------- engine ---------------- */
  function CatacombEngine(opts){
    opts = opts || {};
    this.palettes = {};
    this.volume = (opts.volume!=null) ? clamp(opts.volume,0,1) : 0.9;
    this.ctx = null;
    this._playing = null;
    this._running = false;
    this._timer = null;
    this._drone = [];
  }
  var proto = CatacombEngine.prototype;

  proto.define = function(name, cfg){ this.palettes[name] = normalize(cfg); return this; };
  proto.load   = function(map){ for (var k in map){ if (Object.prototype.hasOwnProperty.call(map,k)) this.define(k, map[k]); } return this; };
  proto.get    = function(name){ return this.palettes[name]; };
  Object.defineProperty(proto, 'isPlaying', { get:function(){ return !!this._running; } });
  Object.defineProperty(proto, 'playing',   { get:function(){ return this._playing; } });

  proto._initAudio = function(){
    if (this.ctx) return true;
    var AC = global.AudioContext || global.webkitAudioContext;
    if (!AC) return false;
    var ctx = new AC(); this.ctx = ctx;
    var master = ctx.createGain(); master.gain.value = this.volume; this.master = master;
    var fade = ctx.createGain(); fade.gain.value = 1; this.fade = fade;
    var comp = ctx.createDynamicsCompressor();
    comp.threshold.value=-16; comp.knee.value=24; comp.ratio.value=3.2; comp.attack.value=0.005; comp.release.value=0.25;
    var lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2600; lp.Q.value=0.4; this.lowpass = lp;
    var conv = ctx.createConvolver(); conv.buffer = this._impulse(3.4,2.6);
    var rv = ctx.createGain(); rv.gain.value=0.42;
    var dry = ctx.createGain(); dry.gain.value=0.9;
    lp.connect(dry).connect(master);
    lp.connect(conv).connect(rv).connect(master);
    var lfo = ctx.createOscillator(); lfo.frequency.value=0.055;
    this._lfoGain = ctx.createGain(); this._lfoGain.gain.value=520; lfo.connect(this._lfoGain).connect(lp.frequency); lfo.start();
    master.connect(comp); comp.connect(fade); fade.connect(ctx.destination);
    this._noise = this._makeNoise();
    this._lyreCache = {};
    return true;
  };
  proto.unlock = function(){ if (this._initAudio() && this.ctx.state==='suspended') this.ctx.resume(); return this; };
  proto.setVolume = function(v){ this.volume = clamp(Number(v),0,1); if (this.master) this.master.gain.setTargetAtTime(this.volume, this.ctx.currentTime, 0.05); return this; };

  proto.play = function(nameOrCfg, opts){
    opts = opts || {};
    var cfg = (typeof nameOrCfg==='string') ? this.palettes[nameOrCfg] : normalize(nameOrCfg);
    if (!cfg) throw new Error('CatacombEngine: unknown palette "'+nameOrCfg+'"');
    if (!this._initAudio()) return this;
    var ctx = this.ctx; if (ctx.state==='suspended') ctx.resume();
    this._teardown(0.08);                              // stop any current track

    this.cfg = cfg; this._iv = cfg.intervals;
    this._playing = (typeof nameOrCfg==='string') ? nameOrCfg : '(inline)';
    this._arr = cfg.arrangement; this._loop = cfg.loop; this._tempo = cfg.tempo;
    this._baseRoot = 48 + cfg.rootIdx;                 // C3 = 48
    var bt = ctx.currentTime;                          // brightness: open the cavern + calm the sweep
    this.lowpass.frequency.setTargetAtTime(cfg.bright?6800:2600, bt, 0.1);
    if (this._lfoGain) this._lfoGain.gain.setTargetAtTime(cfg.bright?300:520, bt, 0.1);
    this.seed = (cfg.seed!=null) ? cfg.seed : (Math.floor(Math.random()*0xffff)||1);
    var sd = this.seed;
    this._sections = {
      verse:  generateSection('verse',  sd*3+11,  cfg.intervals, cfg.moodMul, cfg.lyreDensity, cfg.bassStyle),
      chorus: generateSection('chorus', sd*7+29,  cfg.intervals, cfg.moodMul, cfg.lyreDensity, cfg.bassStyle),
      bridge: generateSection('bridge', sd*13+53, cfg.intervals, cfg.moodMul, cfg.lyreDensity, cfg.bassStyle)
    };
    this._gStep = 0; this._nextTime = ctx.currentTime+0.1; this._lastSec = -1;

    var fin = (opts.fadeIn!=null) ? opts.fadeIn : 0.25;
    this.fade.gain.cancelScheduledValues(ctx.currentTime);
    this.fade.gain.setValueAtTime(0.0001, ctx.currentTime);
    this.fade.gain.exponentialRampToValueAtTime(1, ctx.currentTime + Math.max(fin,0.01));

    this._startDrone(this._baseRoot + ROOTSHIFT[this._arr[0]]);
    this._running = true;
    this._scheduler();
    return this;
  };

  proto.stop = function(opts){
    opts = opts || {};
    if (!this.ctx || !this._running){ this._playing=null; return this; }
    var t=this.ctx.currentTime, f=(opts.fade!=null)?opts.fade:0.4;
    this.fade.gain.cancelScheduledValues(t);
    this.fade.gain.setValueAtTime(Math.max(this.fade.gain.value,0.0001), t);
    this.fade.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(f,0.02));
    this._teardown(f);
    this._playing = null;
    return this;
  };

  proto._teardown = function(release){
    this._running = false;
    if (this._timer){ clearTimeout(this._timer); this._timer=null; }
    this._stopDrone(release!=null?release:0.3);
  };

  proto._scheduler = function(){
    if (!this._running) return;
    var ctx=this.ctx, ahead=0.12, spb=(60/this._tempo)/4, self=this;
    while (this._nextTime < ctx.currentTime + ahead){
      if (!this._scheduleStep(this._gStep, this._nextTime)){    // reached the end (no loop)
        var endAt=this._nextTime+0.2; this._timer=null;
        setTimeout(function(){ if(self._running) self.stop({fade:0.3}); }, (endAt-ctx.currentTime)*1000+250);
        return;
      }
      this._nextTime += spb;
      this._gStep++;
    }
    this._timer = setTimeout(function(){ self._scheduler(); }, 25);
  };

  proto._scheduleStep = function(g, time){
    var arr=this._arr, idx=Math.floor(g/SPS);
    if (this._loop) idx = idx % arr.length;
    else if (idx >= arr.length) return false;
    var type=arr[idx], sec=this._sections[type], local=g%SPS;
    var spb=(60/this._tempo)/4, rootMidi=this._baseRoot + (ROOTSHIFT[type]||0);

    if (local===0 && idx!==this._lastSec){ this._setDroneRoot(rootMidi, time); this._lastSec=idx; }

    var m=sec.melody[local]; if (m) this._tone(this._freq(this._deg(m.deg, rootMidi+12)), time, m.dur*spb*0.92, 0.26);
    var b=sec.bass[local];   if (b) this._bass(this._freq(this._deg(b.deg, rootMidi-12)), time, b.dur*spb*0.95, 0.42);
    var d=sec.drums[local];  if (d==='kick') this._kick(time,0.95); else if (d==='hit') this._hit(time,0.5); else if (d==='tick') this._tick(time,0.5);
    if (this.cfg.lyreOn){ var ly=sec.lyre[local]; if (ly) this._lyre(this._freq(this._deg(ly.deg, rootMidi+12)), time, 0.15); }
    if (this.cfg.choirOn){
      var sib=local%STEPS_PER_BAR, i, h;
      if (type==='chorus'){ for(i=0;i<CHOIR_RHYTHM.length;i++){ h=CHOIR_RHYTHM[i]; if(h.s===sib) this._choir(rootMidi,time,h.d*spb*0.9,0.14*h.v); } }

  };

  /* ---------------- dsp helpers ---------------- */
  proto._freq = function(m){ return 440*Math.pow(2,(m-69)/12); };
  proto._deg  = function(deg, rootMidi){ var iv=this._iv, N=iv.length, oct=Math.floor(deg/N), idx=((deg%N)+N)%N; return rootMidi + oct*12 + iv[idx]; };

  /* ---------------- voices ---------------- */
  proto._tone = function(freq,time,dur,vel){
    var ctx=this.ctx, bright=this.cfg && this.cfg.bright;
    var o1=ctx.createOscillator(); o1.frequency.value=freq;
    var o2=ctx.createOscillator(); o2.frequency.value=freq;

    else       { o1.type='triangle'; o2.type='sawtooth'; o2.detune.value=8; }

    o1.start(time); o2.start(time); o1.stop(time+dur+0.06); o2.stop(time+dur+0.06);
  };
  proto._bass = function(freq,time,dur,vel){
    var ctx=this.ctx, gallop=this.cfg && this.cfg.bassStyle==='gallop';
    var o1=ctx.createOscillator(); o1.type=gallop?'triangle':'sine'; o1.frequency.value=freq;
    var o2=ctx.createOscillator(); o2.type=gallop?'square':'triangle'; o2.frequency.value=freq*2;
    var g=ctx.createGain(); g.gain.setValueAtTime(0.0001,time); g.gain.exponentialRampToValueAtTime(vel,time+(gallop?0.008:0.03)); g.gain.exponentialRampToValueAtTime(0.0001,time+dur);

  };
  proto._kick = function(time,vel){
    var ctx=this.ctx;
    var o=ctx.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(150,time); o.frequency.exponentialRampToValueAtTime(46,time+0.14);
    var g=ctx.createGain(); g.gain.setValueAtTime(vel,time); g.gain.exponentialRampToValueAtTime(0.0001,time+0.36);
    o.connect(g).connect(this.master); o.start(time); o.stop(time+0.38);
    var n=ctx.createBufferSource(); n.buffer=this._noise; var nf=ctx.createBiquadFilter(); nf.type='lowpass'; nf.frequency.value=2600;
    var ng=ctx.createGain(); ng.gain.setValueAtTime(vel*0.3,time); ng.gain.exponentialRampToValueAtTime(0.0001,time+0.03);
    n.connect(nf).connect(ng).connect(this.master); n.start(time); n.stop(time+0.05);
  };
  proto._hit = function(time,vel){
    var ctx=this.ctx; var n=ctx.createBufferSource(); n.buffer=this._noise;
    var f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1900; f.Q.value=0.7;
    var g=ctx.createGain(); g.gain.setValueAtTime(vel*0.5,time); g.gain.exponentialRampToValueAtTime(0.0001,time+0.11);
    n.connect(f).connect(g).connect(this.master); n.start(time); n.stop(time+0.13);
  };
  proto._tick = function(time,vel){
    var ctx=this.ctx; var n=ctx.createBufferSource(); n.buffer=this._noise;
    var f=ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=5200;
    var g=ctx.createGain(); g.gain.setValueAtTime(vel*0.15,time); g.gain.exponentialRampToValueAtTime(0.0001,time+0.04);
    n.connect(f).connect(g).connect(this.master); n.start(time); n.stop(time+0.05);
  };
  proto._lyre = function(freq,time,vel){                 // Karplus–Strong plucked string
    var ctx=this.ctx, key=Math.round(freq*2);
    if (!this._lyreCache[key]){
      var rate=ctx.sampleRate, N=Math.max(2,Math.round(rate/freq)), len=Math.floor(rate*1.4), buf=ctx.createBuffer(1,len,rate), y=buf.getChannelData(0), last=0;
      for (var i=0;i<len;i++){ if(i<N){ var w=Math.random()*2-1; last=(w+last)*0.5; y[i]=last; } else { y[i]=0.995*0.5*(y[i-N]+y[i-N+1]); } }

    var f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=Math.min(freq*7,9500);
    var g=ctx.createGain(); g.gain.value=vel;
    s.connect(f).connect(g).connect(this.lowpass); s.start(time); s.stop(time+1.4);
  };
  proto._choir = function(rootMidi,time,dur,vel){         // punchy formant chord stab
    var ctx=this.ctx, chord=[0,2,4,this._iv.length], self=this;
    var bus=ctx.createGain();
    bus.gain.setValueAtTime(0.0001,time);
    bus.gain.exponentialRampToValueAtTime(vel,time+0.022);
    bus.gain.exponentialRampToValueAtTime(Math.max(vel*0.5,0.0002),time+dur*0.6);
    bus.gain.exponentialRampToValueAtTime(0.0001,time+dur+0.12);
    var f1=ctx.createBiquadFilter(); f1.type='bandpass'; f1.frequency.value=500;  f1.Q.value=1.2;
    var f2=ctx.createBiquadFilter(); f2.type='bandpass'; f2.frequency.value=1150; f2.Q.value=1.4;
    var g1=ctx.createGain(); g1.gain.value=1.0; var g2=ctx.createGain(); g2.gain.value=0.5;
    var lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2600;
    bus.connect(f1).connect(g1).connect(lp); bus.connect(f2).connect(g2).connect(lp); lp.connect(this.lowpass);
    chord.forEach(function(deg,ci){
      var fr=self._freq(self._deg(deg,rootMidi));
      [-6,6].forEach(function(det){
        var o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=fr; o.detune.value=det;
        var g=ctx.createGain(); g.gain.value = ci===3 ? 0.4 : 0.7;
        o.connect(g).connect(bus); o.start(time); o.stop(time+dur+0.2);
      });
    });
  };

  /* ---------------- drone ---------------- */
  proto._startDrone = function(rootMidi){
    this._stopDrone(0.05);
    var ctx=this.ctx, self=this, specs=[{mul:1,type:'sawtooth',gain:0.11},{mul:1.5,type:'triangle',gain:0.075}];
    this._drone=[];
    specs.forEach(function(sp){
      var o=ctx.createOscillator(); o.type=sp.type; o.frequency.value=self._freq(rootMidi-12)*sp.mul;
      var g=ctx.createGain(); g.gain.value=0; g.gain.linearRampToValueAtTime(sp.gain, ctx.currentTime+2.2);
      var f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=460;
      o.connect(g).connect(f).connect(self.lowpass); o.start();
      self._drone.push({o:o,g:g,mul:sp.mul});
    });
  };
  proto._setDroneRoot = function(rootMidi,time){ var self=this; this._drone.forEach(function(d){ d.o.frequency.linearRampToValueAtTime(self._freq(rootMidi-12)*d.mul, time+0.5); }); };
  proto._stopDrone = function(rel){ var ctx=this.ctx; if(!ctx) return; var t=ctx.currentTime; this._drone.forEach(function(d){ d.g.gain.cancelScheduledValues(t); d.g.gain.setValueAtTime(d.g.gain.value,t); d.g.gain.linearRampToValueAtTime(0,t+rel); try{ d.o.stop(t+rel+0.05); }catch(e){} }); this._drone=[]; };

  CatacombEngine.SCALES = SCALES;
  CatacombEngine.NOTES  = NOTES;

  global.CatacombEngine = CatacombEngine;
  if (typeof module!=='undefined' && module.exports) module.exports = CatacombEngine;

})(typeof window!=='undefined' ? window : this);

<script>
"use strict";
(function () {
  // ── Theme: two colors, ink on paper ────────────────────────────
  // A floor is just an ink color and a paper color. Everything is drawn in
  // ink lines and dither on a paper fill, so a pair reskins the whole floor.
  // 20 pairs, each with strong light/dark contrast (or the walls vanish),
  // ranging across warm/cool and light-paper/dark-paper so they feel like
  // different worlds. #0 is the original dark-blue-on-cream.
  //   [name, PAPER (dominant field), INK (lines, speckles, bricks)]
  var PALETTES = [
    ['Cobalt Vellum',    'rgb(255,241,232)', 'rgb(29,43,83)'],   // 0 original: dark blue on cream
    ['Blood Parchment',  'rgb(255,236,214)', 'rgb(126,37,83)'],  // dark purple-red on warm cream

    ['Ink & Bone',       'rgb(240,240,236)', 'rgb(16,16,20)'],   // near-black on bone white
    ['Rust Manuscript',  'rgb(255,238,220)', 'rgb(120,45,20)'],  // burnt sienna on cream
    ['Tyrian Fog',       'rgb(226,224,235)', 'rgb(64,30,90)'],   // royal purple on cool grey
    ['Sepia Tome',       'rgb(244,230,200)', 'rgb(74,52,30)'],   // brown on old-paper tan
    ['Slate Chalk',      'rgb(224,228,232)', 'rgb(40,52,64)'],   // slate on cool white (blueprint-ish)
    // dark-paper (inverted) schemes — light ink on a dark field: another world
    ['Midnight Ash',     'rgb(24,26,38)',    'rgb(214,210,196)'],// bone ink on midnight
    ['Ember Cellar',     'rgb(28,18,16)',    'rgb(255,163,0)'],  // orange ink on near-black (torchlit)
    ['Verdigris Crypt',  'rgb(16,32,30)',    'rgb(120,220,190)'],// mint ink on deep teal
    ['Bruise Vault',     'rgb(26,16,34)',    'rgb(214,150,255)'],// lilac ink on deep violet
    ['Bloodmoon Hall',   'rgb(30,10,12)',    'rgb(255,90,110)'], // red ink on near-black
    ['Deep Fathom',      'rgb(10,22,40)',    'rgb(90,190,255)'], // cyan ink on deep navy
    ['Bog Lantern',      'rgb(18,26,14)',    'rgb(190,230,90)'], // yellow-green ink on swamp dark
    ['Cinder Steel',     'rgb(28,28,30)',    'rgb(180,190,205)'],// steel ink on charcoal
    // high-key / unusual
    ['Bleached Salt',    'rgb(248,248,250)', 'rgb(60,90,120)'],  // muted blue on bright white
    ['Terracotta Sun',   'rgb(255,224,178)', 'rgb(150,40,30)'],  // deep red on warm amber
    ['Moss Vellum',      'rgb(228,236,208)', 'rgb(56,72,28)'],   // olive on pale green
    ['Amethyst Frost',   'rgb(236,232,244)', 'rgb(88,52,140)']   // violet on frost white
  ];
  var pal = 0;

  // ── Catacomb Audio: one music rule set per palette-world ────────
  // The engine (inlined above) turns a compact set of rules — mode, root,
  // tempo, intensity, choir/lyre — into an endless procedural track, no audio
  // files. Each of the 20 visual palettes is its own dungeon "world", so each
  // gets its own rules here, keyed by a slug of the palette's name. Edit a
  // value and that world's music changes. Each has a fixed Seed so a world
  // always sounds like itself; swap a Seed for 'Random' to vary it per visit.
  var MUSIC_RULES = {
    cobalt_vellum:   { M:'Dorian',            Root:'D',  Tempo:92,  Intensity:'Balanced', Choir:'On',  Lyre:'Woven',     Bright:'On', Seed:1301, Loop:true },  // regal illuminated blue: bright square lead over a pedal drone + choir
    blood_parchment: { M:'Phrygian',          Root:'E',  Tempo:70, Intensity:'Balanced', Choir:'On',  Lyre:'Sparse',    Seed:1409, Loop:true },
    forest_ledger:   { M:'Dorian',            Root:'D',  Tempo:72, Intensity:'Sparse',   Choir:'Off', Lyre:'Woven',     Seed:1523, Loop:true },
    ink_and_bone:    { M:'Phrygian',          Root:'E',  Tempo:66, Intensity:'Sparse',   Choir:'Off', Lyre:'Rare',      Seed:1637, Loop:true },
    rust_manuscript: { M:'Dorian',            Root:'G',  Tempo:80, Intensity:'Balanced', Choir:'Off', Lyre:'Sparse',    Seed:1751, Loop:true },
    tyrian_fog:      { M:'Aeolian',           Root:'C#', Tempo:68, Intensity:'Sparse',   Choir:'On',  Lyre:'Woven',     Seed:1865, Loop:true },
    sepia_tome:      { M:'Dorian',            Root:'A',  Tempo:74, Intensity:'Balanced', Choir:'Off', Lyre:'Woven',     Seed:1979, Loop:true },
    slate_chalk:     { M:'Aeolian',           Root:'B',  Tempo:84, Intensity:'Balanced', Choir:'Off', Lyre:'Sparse',    Bright:'On', Seed:2093, Loop:true },  // cool blueprint: clean, crisp bright lead (pedal stays)
    midnight_ash:    { M:'Aeolian',           Root:'A',  Tempo:70, Intensity:'Sparse',   Choir:'On',  Lyre:'Rare',      Seed:2207, Loop:true },
    ember_cellar:    { M:'Phrygian Dominant', Root:'E',  Tempo:88, Intensity:'Frenzied', Choir:'On',  Lyre:'Woven',     Bass:'Gallop', Bright:'On', Seed:2321, Loop:true },  // torchlit charge: galloping bass + bright flicker lead
    verdigris_crypt: { M:'Dorian',            Root:'D',  Tempo:64, Intensity:'Sparse',   Choir:'On',  Lyre:'Cascading', Seed:2435, Loop:true },
    bruise_vault:    { M:'Harmonic Minor',    Root:'F#', Tempo:72, Intensity:'Balanced', Choir:'On',  Lyre:'Woven',     Seed:2549, Loop:true },
    bloodmoon_hall:  { M:'Harmonic Minor',    Root:'E',  Tempo:100, Intensity:'Frenzied', Choir:'Off', Lyre:'Sparse',    Bass:'Gallop', Bright:'On', Seed:2663, Loop:true },  // vampire hunt: galloping bass + bright square lead
    deep_fathom:     { M:'Aeolian',           Root:'D',  Tempo:60, Intensity:'Sparse',   Choir:'On',  Lyre:'Cascading', Seed:2777, Loop:true },
    bog_lantern:     { M:'Dorian',            Root:'G',  Tempo:78, Intensity:'Balanced', Choir:'Off', Lyre:'Cascading', Seed:2891, Loop:true },
    cinder_steel:    { M:'Locrian',           Root:'B',  Tempo:90, Intensity:'Frenzied', Choir:'Off', Lyre:'Rare',      Bass:'Gallop', Bright:'On', Seed:3005, Loop:true },  // industrial: gallop drive + bright metallic dissonance
    bleached_salt:   { M:'Dorian',            Root:'A',  Tempo:82, Intensity:'Balanced', Choir:'Off', Lyre:'Woven',     Bright:'On', Seed:3119, Loop:true },  // brightest world: airy chiptune shimmer over a weightless pedal
    terracotta_sun:  { M:'Phrygian Dominant', Root:'D',  Tempo:86, Intensity:'Balanced', Choir:'On',  Lyre:'Cascading', Bass:'Gallop', Bright:'On', Seed:3233, Loop:true },  // desert ride: gallop + sun-glare bright lead
    moss_vellum:     { M:'Dorian',            Root:'G',  Tempo:70, Intensity:'Sparse',   Choir:'Off', Lyre:'Woven',     Seed:3347, Loop:true },
    amethyst_frost:  { M:'Harmonic Minor',    Root:'C#', Tempo:76,  Intensity:'Balanced', Choir:'On',  Lyre:'Cascading', Bright:'On', Seed:3461, Loop:true }  // icy: glassy bright lead + cascading bell lyre over a still (pedal) drone
  };
  var MUS_VOL = 0.7;                       // master music volume (0..1)
  var music = new CatacombEngine({ volume: MUS_VOL });
  music.load(MUSIC_RULES);
  var musStarted = false;                  // has the first (gesture-unlocked) track begun?
  var musMuted = false;
  var musPal = -1;                         // palette index the current track was built for
  // Palette name -> rules key: "Ink & Bone" -> "ink_and_bone". Derived so the
  // map above stays in sync with PALETTES even if the palette order changes.
  function musKey(i) {
    return PALETTES[i][0].toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
  }
  // Switch the track to match palette `i`. A no-op until the first user gesture
  // has unlocked audio (browsers block sound before then), and skipped when the
  // same world is already playing (so G-regen keeps the current track running).
  function musSwitch(i) {
    if (!musStarted || i === musPal) return;
    var key = musKey(i);
    if (music.get(key)) { music.play(key); musPal = i; }
    musTag();
  }
  // HUD readout of the current world's musical "rules".
  function musTag() {
    var t = document.getElementById('mustag');
    if (!t) return;
    if (musMuted) { t.textContent = '♪ muted'; return; }
    var r = MUSIC_RULES[musKey(pal)];
    t.textContent = r ? ('♪ ' + r.M + ' · ' + r.Root + ' · ' + r.Tempo + ' bpm') : '';
  }
  function musToggleMute() {
    musMuted = !musMuted;
    music.setVolume(musMuted ? 0 : MUS_VOL);

  var PAPER, INK;      // wall face + wall lines/bricks (whichever the palette names)
  var DARK, LIGHT;     // ceiling is ALWAYS the darker of the two, floor the lighter,
                       // so up/down never flips between palettes — only the hue changes.

    if (lum(PAPER) <= lum(INK)) { DARK = PAPER; LIGHT = INK; }

    { cat: "people", diff: "easy",
      q: "Who built an ark to survive the flood?",
      a: ["Noah", "Moses", "Abraham", "David"], correct: 0 },
    { cat: "places", diff: "easy",
      q: "In what town was Jesus born?",
      a: ["Bethlehem", "Nazareth", "Jerusalem", "Jericho"], correct: 0 },
    { cat: "gospels", diff: "medium",
      q: "How many loaves fed the five thousand?",

    { cat: "quotes", diff: "medium",
      q: "Who said \"Let there be light\"?",
      a: ["God", "Adam", "Elijah", "Paul"], correct: 0 },
    { cat: "people", diff: "hard",
      q: "Who was the father of King Solomon?",
      a: ["David", "Saul", "Samuel", "Jesse"], correct: 0 }
  ];

  // ── Jester passages ─────────────────────────────────────────────
  // The jester reads one of these and you call it REAL or FAKE. Real ones are
  // KJV with a `ref`; fakes are sayings people often think are in the Bible,

  //   { text: "The saying.",  real: false, why: "Who really said it" }
  var JESTER_PASSAGES = [
    { text: "Jesus wept.", real: true, ref: "John 11:35" },
    { text: "Be still, and know that I am God.", real: true, ref: "Psalm 46:10" },
    { text: "A soft answer turneth away wrath.", real: true, ref: "Proverbs 15:1" },
    { text: "Pride goeth before destruction, and an haughty spirit before a fall.", real: true, ref: "Proverbs 16:18" },
    { text: "The Lord is my shepherd; I shall not want.", real: true, ref: "Psalm 23:1" },
    { text: "For the love of money is the root of all evil.", real: true, ref: "1 Timothy 6:10" },
    { text: "The wolf also shall dwell with the lamb.", real: true, ref: "Isaiah 11:6" },
    { text: "Iron sharpeneth iron.", real: true, ref: "Proverbs 27:17" },
    { text: "There is no new thing under the sun.", real: true, ref: "Ecclesiastes 1:9" },
    { text: "Man shall not live by bread alone.", real: true, ref: "Matthew 4:4" },
    { text: "God helps those who help themselves.", real: false, why: "Ben Franklin said it" },
    { text: "Cleanliness is next to godliness.", real: false, why: "John Wesley said it" },
    { text: "Charity begins at home.", real: false, why: "An old English proverb" },
    { text: "The lion shall lie down with the lamb.", real: false, why: "The wolf, not the lion" },
    { text: "Spare the rod and spoil the child.", real: false, why: "Samuel Butler, a poem" },
    { text: "God works in mysterious ways.", real: false, why: "William Cowper, a hymn" },
    { text: "This too shall pass.", real: false, why: "A Persian proverb" },
    { text: "To thine own self be true.", real: false, why: "Shakespeare, Hamlet" },
    { text: "Pride goeth before a fall.", real: false, why: "Destruction, not a fall" },
    { text: "God will not give you more than you can handle.", real: false, why: "A twist on 1 Cor 10:13" }
  ];

  // ── Dungeon generator (seeded) ─────────────────────────────────
  // Lifted from the worksheet maze generator and adapted for the crawler.
  // mulberry32 RNG → a recursive-backtracker carve → cuts + jump pairs +
  // false walls, with a doubled-state BFS proving every floor is solvable and
  // REGENERATING (never degrading) when it isn't. The thin-wall R×C maze is
  // then expanded into the raycaster's solid (2R+1)×(2C+1) MAP: maze cells and
  // carved gaps become open cells, everything else is wall — so every corridor
  // is one cell wide and every doorway is flanked by walls automatically.
  //
  // solve() is the doubled-state solver: state = cell + N·(has-key). Today the
  // "have-key" flag is a 1-bit item bitmask.  STAGE 2 widens it to k bits (key
  // + gating armor + the full set for the dragon door): let the state be
  // cell + N·mask over 2^k masks, seed `first` with the pickups on START,
  // OR the picked-up item's bit into the mask on each step, and make the `end`
  // targets range over the masks that clear the exit. Nothing else changes.
  function makeRng(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function newSeed() { return (Math.random() * 4294967296) >>> 0; }
  function randInt(rng, n) { return Math.floor(rng() * n); }
  function shuffledA(list, rng) {              // seeded Fisher-Yates (copy)
    var a = list.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // Each square's neighbours, worked out once per maze size (the checks walk
  // the maze thousands of times per generate, so this caching matters).
  var NBR_CACHE = {};
  function neighborLists(R, C) {
    var k = R + 'x' + C;
    if (NBR_CACHE[k]) return NBR_CACHE[k];
    var lists = [];
    for (var id = 0; id < R * C; id++) {
      var r = Math.floor(id / C), c = id % C, out = [];
      if (r > 0) out.push(id - C);
      if (r < R - 1) out.push(id + C);
      if (c > 0) out.push(id - 1);
      if (c < C - 1) out.push(id + 1);
      lists.push(out);
    }
    return (NBR_CACHE[k] = lists);

  function Grid(R, C) {
    this.R = R; this.C = C; this.N = R * C;
    this.nb = neighborLists(R, C);
    this.openR = new Uint8Array(this.N);            // gap to the right of a square
    this.openD = new Uint8Array(this.N);            // gap below a square
    this.fake = {};                                 // gaps that are locked doors
    this.partner = new Int32Array(this.N).fill(-1); // jump pad -> its twin
    this.keyCell = -1;                              // where the key sits
  }
  Grid.prototype.nbrs = function (id) { return this.nb[id]; };
  Grid.prototype.key = function (a, b) {
    var lo = Math.min(a, b), hi = Math.max(a, b);
    return lo * 2 + (hi - lo === 1 ? 0 : 1);
  };
  Grid.prototype.isOpen = function (a, b) {
    var lo = Math.min(a, b), hi = Math.max(a, b);
    return (hi - lo === 1 ? this.openR[lo] : this.openD[lo]) === 1;
  };
  Grid.prototype.setOpen = function (a, b, v) {
    var lo = Math.min(a, b), hi = Math.max(a, b);
    if (hi - lo === 1) this.openR[lo] = v; else this.openD[lo] = v;
  };
  Grid.prototype.adjacent = function (a, b) { return this.nbrs(a).indexOf(b) !== -1; };
  Grid.prototype.degree = function (id) {
    var g = this;
    return this.nbrs(id).filter(function (n) { return g.isOpen(id, n); }).length;
  };
  // Where can you go? jumps: hop between linked pads. solidFake: doors shut.
  Grid.prototype.moves = function (id, jumps, solidFake) {
    var g = this, out = [];
    this.nbrs(id).forEach(function (n) {
      if (!g.isOpen(id, n)) return;
      if (solidFake && g.fake[g.key(id, n)]) return;
      out.push(n);
    });
    if (jumps && this.partner[id] >= 0) out.push(this.partner[id]);
    return out;
  };
  // Solve it the way the player must: doors stay shut until the key is found.
  // Each step tracks the cell AND whether the key is held (cell + N == "has").
  Grid.prototype.solve = function () {
    var N = this.N, dist = new Int32Array(2 * N).fill(-1), prev = new Int32Array(2 * N).fill(-1);
    var first = this.start + (this.start === this.keyCell ? N : 0), q = [first], h = 0;
    dist[first] = 0;
    while (h < q.length) {
      var st = q[h++], cel = st % N, has = st >= N;
      var ms = this.moves(cel, true, !has);
      for (var i = 0; i < ms.length; i++) {
        var ns = ms[i] + ((has || ms[i] === this.keyCell) ? N : 0);
        if (dist[ns] < 0) { dist[ns] = dist[st] + 1; prev[ns] = st; q.push(ns); }
      }
    }
    var end = -1;
    [this.finish, this.finish + N].forEach(function (f) {
      if (dist[f] >= 0 && (end < 0 || dist[f] < dist[end])) end = f;
    });
    return { len: end < 0 ? -1 : dist[end], end: end, dist: dist, prev: prev };
  };
  Grid.prototype.walk = function (src, jumps, solidFake) {
    var dist = new Int32Array(this.N).fill(-1), prev = new Int32Array(this.N).fill(-1);
    var q = [src], h = 0; dist[src] = 0;
    while (h < q.length) {
      var cur = q[h++], ms = this.moves(cur, jumps, solidFake);
      for (var i = 0; i < ms.length; i++) {
        if (dist[ms[i]] < 0) { dist[ms[i]] = dist[cur] + 1; prev[ms[i]] = cur; q.push(ms[i]); }
      }
    }
    return { dist: dist, prev: prev };
  };

  function carve(g, rng) {            // one long winding maze (recursive backtracker)
    var seen = new Uint8Array(g.N), stack = [randInt(rng, g.N)];
    seen[stack[0]] = 1;
    while (stack.length) {
      var cur = stack[stack.length - 1];
      var opts = g.nbrs(cur).filter(function (n) { return !seen[n]; });
      if (!opts.length) { stack.pop(); continue; }
      var nx = opts[randInt(rng, opts.length)];
      g.setOpen(cur, nx, 1);
      seen[nx] = 1;
      stack.push(nx);
    }
    g.start = randInt(rng, g.C);
    g.finish = (g.R - 1) * g.C + randInt(rng, g.C);
  }

  function mazeAttempt(R, C, rng, useFakes) {
    var g = new Grid(R, C), N = g.N, start, finish;
    carve(g, rng);
    start = g.start; finish = g.finish;

    // Wall it into parts at 1 or 2 spots along the way from START to FINISH.
    var t = g.walk(start, false), path = [];
    for (var p = finish; p !== -1; p = t.prev[p]) path.unshift(p);
    var L = path.length - 1;
    if (L < 8) return null;
    function spot(lo, hi) {
      var a = Math.floor(L * lo), span = Math.max(1, Math.floor(L * (hi - lo)));
      return Math.min(L - 1, a + randInt(rng, span));
    }
    var cuts;
    if (N >= 250) cuts = rng() < 0.5 ? [spot(0.15, 0.3), spot(0.42, 0.58), spot(0.7, 0.85)]
                                     : [spot(0.2, 0.42), spot(0.58, 0.8)];
    else if (N >= 90 && rng() < 0.65) cuts = [spot(0.2, 0.42), spot(0.58, 0.8)];
    else cuts = [spot(0.3, 0.7)];
    cuts.forEach(function (i) { g.setOpen(path[i], path[i + 1], 0); });

    // Seal off a small pocket away from the route (two in a big maze). An
    // extra jump pair leads into each: a dead end reachable only by jumping.
    var routeCell = new Uint8Array(N), inPocket = new Uint8Array(N);
    path.forEach(function (c) { routeCell[c] = 1; });
    var pocketMax = Math.min(24, Math.max(8, Math.round(N * 0.11)));
    var pocketCells = [], pocketsWanted = N >= 250 ? 2 : 1;
    for (var pk = 0; pk < pocketsWanted; pk++) {
      var tree = [];
      for (var u = 0; u < N; u++) {
        g.nbrs(u).forEach(function (v) {
          if (v > u && g.isOpen(u, v) && !inPocket[u] && !inPocket[v]) tree.push([u, v]);
        });
      }
      shuffledA(tree, rng).slice(0, 40).some(function (e) {
        if (routeCell[e[0]] && routeCell[e[1]]) return false;
        g.setOpen(e[0], e[1], 0);
        var sides = [e[0], e[1]].map(function (c) {
          var d = g.walk(c, false).dist, n = 0, touchesPath = false;
          for (var k = 0; k < N; k++) if (d[k] >= 0) { n++; if (routeCell[k]) touchesPath = true; }
          return { cell: c, size: n, touchesPath: touchesPath, dist: d };
        });
        var pocket = sides.filter(function (sd) { return !sd.touchesPath; })[0];
        if (pocket && pocket.size >= 5 && pocket.size <= pocketMax) {
          pocketCells.push(pocket.cell);
          for (var k2 = 0; k2 < N; k2++) if (pocket.dist[k2] >= 0) inPocket[k2] = 1;
          return true;
        }
        g.setOpen(e[0], e[1], 1);               // not a good pocket: put the gap back
        return false;
      });
    }

    var comp = new Int32Array(N).fill(-1), sizes = [];
    for (var s = 0; s < N; s++) {
      if (comp[s] >= 0) continue;
      var d0 = g.walk(s, false).dist, n = 0;
      for (var k = 0; k < N; k++) if (d0[k] >= 0) { comp[k] = sizes.length; n++; }
      sizes.push(n);
    }
    var chain = [comp[start]];      // the parts, in the order you pass through them
    cuts.forEach(function (i) { chain.push(comp[path[i + 1]]); });
    if (chain[chain.length - 1] !== comp[finish]) return null;
    var minPart = chain.length >= 4 ? 0.12 : 0.18;
    if (chain.some(function (c) { return sizes[c] < N * minPart; })) return null;

    // A few extra gaps inside each part, so there are loops to get lost in.
    var walls = [];
    for (var a = 0; a < N; a++) {
      g.nbrs(a).forEach(function (b) {
        if (b > a && !g.isOpen(a, b) && comp[a] === comp[b]) walls.push([a, b]);
      });
    }
    shuffledA(walls, rng).slice(0, Math.round(N / 15)).forEach(function (w) {
      g.setOpen(w[0], w[1], 1);
    });

    // Jump pads: never on START/FINISH or right beside them, never touching
    // each other, and happiest tucked into dead ends.
    var dS = g.walk(start, false).dist, dF = g.walk(finish, false).dist;
    var pads = [];
    function placePad(c, awayFrom) {
      var cands = [];
      for (var id = 0; id < N; id++) {
        if (comp[id] !== c || id === start || id === finish) continue;
        if ((dS[id] >= 0 && dS[id] < 3) || (dF[id] >= 0 && dF[id] < 3)) continue;
        if (pads.some(function (q) { return q === id || g.adjacent(q, id); })) continue;
        cands.push(id);
      }
      if (!cands.length) return -1;
      var dead = cands.filter(function (id) { return g.degree(id) === 1; });
      var pool = dead.length >= 3 ? dead : cands;
      if (awayFrom != null) {                 // pick from the farther half
        var d = g.walk(awayFrom, false).dist;
        pool = pool.slice().sort(function (x, y) { return d[y] - d[x]; });
        pool = pool.slice(0, Math.max(1, Math.ceil(pool.length / 2)));
      }
      var pick = pool[randInt(rng, pool.length)];
      pads.push(pick);
      return pick;
    }
    var pairs = [], from = placePad(chain[0], start);
    for (var j = 1; j < chain.length; j++) {
      var last = j === chain.length - 1;
      var to = placePad(chain[j], last ? finish : null);
      if (from < 0 || to < 0) return null;
      pairs.push([from, to]);
      if (!last) from = placePad(chain[j], to);
    }
    pocketCells.forEach(function (pc) {                // pairs that lead nowhere
      var e1 = placePad(chain[randInt(rng, chain.length)], null);
      var e2 = e1 < 0 ? -1 : placePad(comp[pc], null);
      if (e1 >= 0 && e2 >= 0) pairs.push([e1, e2]);
    });
    pairs.forEach(function (pr) {
      g.partner[pr[0]] = pr[1];
      g.partner[pr[1]] = pr[0];
    });

    // False walls (locked doors). Each goes on a gap that is the only way (on
    // foot) into the area behind it, so it truly seals that area. Never on
    // START or FINISH, and spread out.
    var fakes = [];
    function tooClose(e) {
      return fakes.some(function (o) {
        return o.some(function (x) {
          return e.some(function (y) {
            return Math.abs(Math.floor(x / C) - Math.floor(y / C)) + Math.abs(x % C - y % C) <= 2;
          });
        });
      });
    }
    function room(e) {               // size of the smaller side, or 0 if not sealed
      g.setOpen(e[0], e[1], 0);
      var d0 = g.walk(e[0], false).dist, d1 = g.walk(e[1], false).dist;
      g.setOpen(e[0], e[1], 1);
      if (d0[e[1]] >= 0) return 0;   // there's another way round: not a room
      var n0 = 0, n1 = 0;
      for (var k = 0; k < N; k++) { if (d0[k] >= 0) n0++; if (d1[k] >= 0) n1++; }
      return { size: Math.min(n0, n1), side: n0 <= n1 ? d0 : d1 };
    }
    function nearPad(c) {                 // c is, or touches, a jump pad (gate)?
      if (g.partner[c] >= 0) return true;
      var nb = g.nb[c];
      for (var i = 0; i < nb.length; i++) if (g.partner[nb[i]] >= 0) return true;
      return false;
    }
    function usable(e) {
      return e[0] !== start && e[1] !== start && e[0] !== finish && e[1] !== finish &&

             !nearPad(e[0]) && !nearPad(e[1]);      // never a door right by a teleport
    }
    if (useFakes) {
      // On the way to FINISH, ones you can't do without (2 in a big maze).
      var run0 = g.walk(start, true), route = [];
      for (var p2 = finish; p2 !== -1; p2 = run0.prev[p2]) route.unshift(p2);
      var steps = route.slice(1).map(function (c, i) { return [route[i], c]; });
      var mustHave = N >= 250 ? 2 : 1;
      shuffledA(steps, rng).some(function (e) {
        if (fakes.length >= mustHave) return true;
        if (!g.adjacent(e[0], e[1]) || !usable(e)) return false;   // a jump, or a bad spot
        var rm = room(e);
        if (!rm || rm.size < 3) return false;
        g.setOpen(e[0], e[1], 0);                                  // is there any way round it?
        var needed = g.walk(start, true).dist[finish] < 0;
        g.setOpen(e[0], e[1], 1);
        if (!needed) return false;
        g.fake[g.key(e[0], e[1])] = true;
        fakes.push(e);
        return false;
      });
      if (!fakes.length) return null;

      // More that lead into rooms with no START or FINISH in them (decoys).
      var extra = N >= 250 ? 3 + randInt(rng, 3) : 2 + randInt(rng, 2);
      var want = fakes.length + extra, gaps = [];
      for (var x = 0; x < N; x++) {
        g.nbrs(x).forEach(function (y) { if (y > x && g.isOpen(x, y)) gaps.push([x, y]); });
      }
      shuffledA(gaps, rng).some(function (e) {
        if (fakes.length >= want) return true;
        if (!usable(e)) return false;
        var rm = room(e);
        if (!rm || rm.size < 3 || rm.size > N * 0.3) return false;
        if (rm.side[start] >= 0 || rm.side[finish] >= 0) return false;
        g.fake[g.key(e[0], e[1])] = true;
        fakes.push(e);
        return false;
      });
    }

    // The key cell: a true dead end reachable from START without opening any
    // door (jumps fine), taken from the farther third so you go looking. Not a
    // spot that only looks dead because a door sits beside it.
    if (useFakes) {
      var noDoors = g.walk(start, true, true).dist, ends = [], nearDoorC = [];
      for (var kc = 0; kc < N; kc++) {
        if (noDoors[kc] < 0 || kc === start || kc === finish || g.partner[kc] >= 0) continue;
        var sd = 0, dr = 0;
        for (var ni = 0; ni < g.nb[kc].length; ni++) {
          var nn = g.nb[kc][ni];
          if (!g.isOpen(kc, nn)) continue;
          if (g.fake[g.key(kc, nn)]) dr++; else sd++;
        }
        if (sd === 1) (dr ? nearDoorC : ends).push(kc);
      }
      if (!ends.length) ends = nearDoorC;
      if (!ends.length) return null;
      ends.sort(function (x1, x2) { return noDoors[x2] - noDoors[x1]; });
      var far = ends.slice(0, Math.max(1, Math.ceil(ends.length / 3)));
      g.keyCell = far[randInt(rng, far.length)];
    }

    // The checks — regenerate (return null) rather than ship a bad floor.
    var sol = g.solve(), len = sol.len;
    if (len < 0) return null;                                           // must be solvable
    if (g.walk(start, false).dist[finish] >= 0) return null;            // must need a jump
    if (pairs.some(function (pr) {                                      // never jump where you could walk
      return g.walk(pr[0], false).dist[pr[1]] >= 0;
    })) return null;
    if (useFakes && g.walk(start, true, true).dist[finish] >= 0) return null;  // must need the key
    var onRoute = 0, reach = 0;
    for (var st = sol.end; sol.prev[st] >= 0; st = sol.prev[st]) {
      var a2 = sol.prev[st] % N, b2 = st % N;
      if (g.adjacent(a2, b2) && g.fake[g.key(a2, b2)]) onRoute++;
    }
    for (var z = 0; z < N; z++) if (sol.dist[z] >= 0 || sol.dist[z + N] >= 0) reach++;
    var detour = useFakes ? len - g.walk(start, true).dist[finish] : 0;
    g.good = !useFakes || len >= R + C;
    g.score = len + 5 * Math.min(onRoute, 2) + 2 * fakes.length + 0.5 * Math.min(detour, 30) -
              0.15 * (N - reach);
    return g;
  }

  function makeMaze(R, C, rng) {
    var best = null, g, i;
    // The worksheet chased the single best-scoring maze; a game floor only needs
    // a good, solvable one, so cap the budget and stop early once we have a
    // "good" maze with a few samples behind it — keeps descents snappy.
    var tries = Math.min(150, Math.max(40, Math.round(300 * 126 / (R * C))));
    for (i = 0; i < tries; i++) {
      g = mazeAttempt(R, C, rng, true);
      if (!g) continue;
      if (!best || (g.good && !best.good) || (g.good === best.good && g.score > best.score)) best = g;
      if (best && best.good && i >= 24) break;      // good enough — don't grind
    }
    if (best) return best;
    for (i = 0; i < 60; i++) {              // no false walls: jumps only
      g = mazeAttempt(R, C, rng, false);
      if (g) return g;
    }
    g = new Grid(R, C);                      // last resort: a plain maze
    carve(g, rng);
    return g;
  }

  // ── The live map (built by generateFloor) ──────────────────────
  // 1 and 2 are walls (two values so wall-to-wall colour changes ink as
  // edges); 0 is open. Doors live in `doors`/`doorMap`, not in the strings.
  var MAP = [], MH = 0, MW = 0;
  var curSeed = 0;                 // this floor's seed (for the resume password later)
  var finishCX = 0, finishCY = 0;  // the exit cell — reserved for the Stage 2 dragon
  var doors = [];                 // openable-wall doors on this floor
  var doorMap = {};               // (y*MW + x) -> door, so cell() stays O(1)
  // Crawl-through false walls: NOT grid cells but planes drawn across a corridor
  // — a brick wall with a dark tunnel at the base. They block movement unless
  // you hold DOWN (duck/crawl), so they never threaten solvability.
  var falseWalls = [];            // [{cx, cy, axis}]
  var falseMap = {};              // (y*MW + x) -> false wall, for collision
  function cell(x, y) {
    if (x < 0 || y < 0 || x >= MW || y >= MH) return 1;
    var id = (y | 0) * MW + (x | 0);
    // A door cell is solid while shut, open once swung — movement and
    // raycasting both treat it correctly with no special cases elsewhere.
    var d = doorMap[id];
    if (d) return d.open ? 0 : 1;
    // A false wall reads SOLID to sight (the raycaster draws its custom face);
    // crawling through it is handled in movement (passable), not here.
    if (falseMap[id]) return 1;
    var ch = MAP[y | 0].charAt(x | 0);
    return ch === '0' ? 0 : (ch.charCodeAt(0) - 48);
  }

  // Expand the thin-wall maze into the solid MAP and lay in spawn, exit,
  // doors, gates and chests. Cell id -> MAP centre: (2c+1, 2r+1).
  function buildFromMaze(g, rng) {
    var R = g.R, C = g.C;
    // A wall margin on the left and right so the boss arena below the exit is
    // always a full symmetric diamond, wherever along the bottom row the exit
    // (the dragon door) lands — even hard against a side wall. The maze sits
    // inset by MARGIN columns; those extra columns are never-visited outer wall,
    // so nothing the player reaches changes.
    var MARGIN = 2;
    MH = 2 * R + 1; MW = 2 * C + 1 + 2 * MARGIN;
    function mx(id) { return 2 * (id % C) + 1 + MARGIN; }
    function my(id) { return 2 * ((id / C) | 0) + 1; }

    // Solid everywhere, then open the maze cells and carved gaps. A stable
    // per-pixel hash flips some walls to value 2 so seams get inked.
    var grid = [];
    for (var y = 0; y < MH; y++) {
      var row = [];
      for (var x = 0; x < MW; x++)
        row.push((((x * 73856093) ^ (y * 19349663)) >>> 0) % 6 === 0 ? '2' : '1');
      grid.push(row);
    }
    for (var id = 0; id < g.N; id++) grid[my(id)][mx(id)] = '0';

    doors = []; doorMap = {};
    falseWalls = []; falseMap = {};        // cleared up front so cell() is clean during generation
    function addDoor(gx, gy, axis) {
      var d = { cx: gx, cy: gy, open: false, opening: false, anim: 0, axis: axis };
      doors.push(d); doorMap[gy * MW + gx] = d;
    }
    for (var id2 = 0; id2 < g.N; id2++) {
      var r = (id2 / C) | 0, c = id2 % C;
      if (c < C - 1 && g.isOpen(id2, id2 + 1)) {           // gap to the east
        var hx = mx(id2) + 1, hy = 2 * r + 1; grid[hy][hx] = '0';
        if (g.fake[g.key(id2, id2 + 1)]) addDoor(hx, hy, 'ew');   // pass E-W: walls N/S
      }
      if (r < R - 1 && g.isOpen(id2, id2 + C)) {           // gap to the south
        var vx = mx(id2), vy = 2 * r + 2; grid[vy][vx] = '0';
        if (g.fake[g.key(id2, id2 + C)]) addDoor(vx, vy, 'ns');   // pass N-S: walls E/W
      }
    }
    MAP = grid.map(function (rr) { return rr.join(''); });

    // Spawn at START, facing the most open way in.

    // apart as possible, so finding each one is exploration — you search the
    // whole floor, never a single room. You don't know which chest holds the key
    // until you open it. The key's chest still follows the kids.py rule: a true

    var far = kends.slice(0, Math.max(1, Math.ceil(kends.length / 3)));
    var keyCell = far.length ? far[randInt(rng, far.length)]

    for (var i = 0; i < 4; i++) {
      var dx = dirs[i][0], dy = dirs[i][1], x = cxi, y = cyi, run = 0;
      while (run < 6) { x += dx; y += dy; if (cell(x, y) === 0) run++; else break; }

  function descend() {

    return a;

  // Shared by the trivia path (on a right answer) and the secret no-trivia path.
  function awardChest(chest) {
    chest.opened = true;
    sfxPickup();                     // reward chime on any chest grant (trivia-right or secret &)
    if (chest.hasKey)     { hasKey = true;      score += 50; return 'GOT THE KEY!'; }
    if (chest.hasMap)     { chestReveal = true; score += 50; return 'FOUND THE MAP!'; }
    if (chest.hasCompass) { hasCompass = true;  score += 50; return 'FOUND THE COMPASS!'; }
    score += 100; return '+100!';
  }

  // choice. Falls back to the whole bank if the band is empty.
  function pickQuestion(avoid) {
    var pool = QUESTIONS.filter(function (q) { return q.diff === difficulty && q !== avoid; });
    if (!pool.length) pool = QUESTIONS.filter(function (q) { return q.diff === difficulty; });
    if (!pool.length) pool = QUESTIONS;
    return pool[(Math.random() * pool.length) | 0];

    if (triviaOff) {                 // secret & toggle: skip the question, take the contents

      return;

    var q = pickQuestion(lastChestQ);                // your difficulty band
    lastChestQ = q;
    quiz = { chest: chest, q: q, order: shuffle(q.a.length), sel: 0, result: null, resultT: 0 };
    sfxTrivia();                      // the prompt is opening
    mode = 'answer';

  }

    if (!quiz || quiz.result) return;
    var chosen = quiz.order[quiz.sel];          // real index of the highlighted answer
    var right = chosen === quiz.q.correct;

    quiz.resultT = 0;
    if (quiz.boss) { bossResolve(right); return; }
    if (quiz.jester) { jesterResolve(right); return; }
    if (quiz.merchant) { merchantResolve(right); return; }
    var chest = quiz.chest;
    if (right) {

      quiz.reward = awardChest(chest);
    } else {
      // Failed: the chest is NOT spent — you can walk back up and open it
      // again for a new question. The missed question feeds the boss's pool
      // (which pulls your misses first). No reveal, no reward.
      if (missed.indexOf(quiz.q) === -1) missed.push(quiz.q);
      quiz.reward = 'WRONG!';
    }

  // ── Jester encounter ──

  // equipment is marked on the minimap and he stays, bowing (done). Wrong: he
  // vanishes for the rest of the floor, and the answer is NOT shown.
  function nearJester() {
    if (!jester || jester.done) return false;
    var dx = jester.x - px, dy = jester.y - py;
    return dx * dx + dy * dy < JESTER_RANGE * JESTER_RANGE;
  }
  function openJester() {
    if (jesterUsed.length >= JESTER_PASSAGES.length) jesterUsed.length = 0;
    var pool = [];
    for (var i = 0; i < JESTER_PASSAGES.length; i++) if (jesterUsed.indexOf(i) < 0) pool.push(i);
    var pi = pool[(Math.random() * pool.length) | 0];
    jesterUsed.push(pi);
    var p = JESTER_PASSAGES[pi];
    quiz = { jester: true, passage: p, q: { q: '"' + p.text + '"', a: ['Real', 'Fake'], correct: p.real ? 0 : 1 },
             order: [0, 1], sel: 0, result: null, resultT: 0 };   // fixed order: REAL then FAKE
    sfxTrivia();

    keys = {};
  }
  function jesterResolve(right) {
    if (right) {

      sfxPickup();
    } else {

  }
  function jesterAfter() {                         // the result banner has closed
    var right = quiz.result === 'right';
    quiz = null; mode = 'explore';
    if (right) {
      jester.done = true;
      mapReveal = true;
      score += 100;
      pickup = 'EQUIPMENT MARKED ON MAP'; pickupT = 0;
    } else {
      jester = null;                               // gone for the floor
      sfxTeleport();
      flash = 0.3;
    }
  }

  // ── Merchant encounter ──
  function spawnMerchant(minDist) {                // into a walked square away from you; false if none yet
    var occ = {};
    chests.forEach(function (c) { if (!c.opened) occ[(c.y | 0) * MW + (c.x | 0)] = 1; });
    gates.forEach(function (g) { occ[(g.y | 0) * MW + (g.x | 0)] = 1; });
    armorItems.forEach(function (a) { if (!a.taken) occ[(a.y | 0) * MW + (a.x | 0)] = 1; });
    if (jester) occ[(jester.y | 0) * MW + (jester.x | 0)] = 1;
    var top = bossRoom ? bossRoom.y0 - 1 : MH, cand = [];
    for (var y = 1; y < top; y++) for (var x = 1; x < MW - 1; x++) {
      var id = y * MW + x;
      if (!visited[id] || occ[id] || doorMap[id] || falseMap[id] || MAP[y].charAt(x) !== '0') continue;
      if (Math.abs(x + 0.5 - px) + Math.abs(y + 0.5 - py) < minDist) continue;
      cand.push(id);
    }
    if (!cand.length) return false;
    var pick = cand[(Math.random() * cand.length) | 0];
    merchant = { x: (pick % MW) + 0.5, y: ((pick / MW) | 0) + 0.5, lastQ: null, asked: 0, used: [] };
    merchantState = 'here';
    pickup = 'MERCHANT ARRIVED'; pickupT = 0;
    sfxTrivia();
    return true;
  }
  function nearMerchant() {
    if (!merchant) return false;
    var dx = merchant.x - px, dy = merchant.y - py;
    return dx * dx + dy * dy < MERCHANT_RANGE * MERCHANT_RANGE;
  }
  function openMerchant() {
    var tier = TIER_UP[difficulty], q = null, fromMissed = false;
    if (tier === 'missed' && missed.length) { q = missed[(Math.random() * missed.length) | 0]; fromMissed = true; }
    else {
      var want = tier === 'missed' ? 'hard' : tier;   // no misses yet: a Hard one instead
      var used = merchant.used || [];
      var pool = QUESTIONS.filter(function (qq) { return qq.diff === want && used.indexOf(qq) < 0; });
      if (!pool.length) pool = QUESTIONS.filter(function (qq) { return qq.diff === want && qq !== merchant.lastQ; });
      if (!pool.length) pool = QUESTIONS.filter(function (qq) { return qq.diff === want; });
      if (!pool.length) pool = QUESTIONS;
      q = pool[(Math.random() * pool.length) | 0];
      tier = want;
    }
    merchant.lastQ = q;
    (merchant.used = merchant.used || []).push(q);
    quiz = { merchant: true, tier: fromMissed ? 'missed' : tier, fromMissed: fromMissed,
             n: (merchant.asked || 0) + 1, of: MERCHANT_TRIES[difficulty] || 1,
             q: q, order: shuffle(q.a.length), sel: 0, result: null, resultT: 0 };
    sfxTrivia();
    mode = 'answer';
    keys = {};
  }
  function merchantResolve(right) {
    if (right) {
      bonusHearts++;
      if (quiz.fromMissed) { var mi = missed.indexOf(quiz.q); if (mi >= 0) missed.splice(mi, 1); }   // learned it
      quiz.reward = 'DRAGON HEART +1';
      sfxPickup();
    } else {
      if (missed.indexOf(quiz.q) === -1) missed.push(quiz.q);
      quiz.reward = 'WRONG!';
    }
  }
  function merchantAfter() {                       // the result banner has closed
    quiz = null; mode = 'explore';
    merchant.asked = (merchant.asked || 0) + 1;
    if (merchant.asked < (MERCHANT_TRIES[difficulty] || 1)) { openMerchant(); return; }   // next chance
    merchant = null; merchantState = 'gone';
    pickup = 'MERCHANT LEFT'; pickupT = 0;
  }

  // ── Dragon fight ──
  function startBoss() {
    // Plant the player at the arena mouth facing the dais, so the whole
    // dragon (and every head's arrow) fits on screen.
    px = dragon.x; py = bossRoom.y0 + 0.5;
    ang = Math.atan2(dragon.y - py, dragon.x - px);
    pitch = 0; posZ = 0; crawlZ = 0; crawlCell = -1;
    keys = {}; touchReset();
    boss = { heads: [true, true, true, true, true], weak: (Math.random() * 5) | 0,
             hearts: BOSS_HEARTS + bonusHearts, maxHearts: BOSS_HEARTS + bonusHearts,
             sel: 2, rects: null, lastQ: null };
    bonusHearts = 0;                               // the merchant's hearts are spent on this fight
    mode = 'heads';
    sfxTrivia();
    flash = 0.2;
  }
  function headStep(dir) {                         // move the head cursor to the next living head
    for (var k = 1; k <= 5; k++) {
      var i = (boss.sel + dir * k + 5) % 5;
      if (boss.heads[i]) { boss.sel = i; return; }
    }
  }
  function bossAsk(i) {
    if (!boss || !boss.heads[i]) return;
    boss.sel = i;
    var q = missed.length ? missed.shift() : null;   // your misses come back first
    if (!q) q = pickQuestion(boss.lastQ);            // then your difficulty band
    boss.lastQ = q;
    quiz = { boss: true, head: i, q: q, order: shuffle(q.a.length), sel: 0, result: null, resultT: 0 };
    sfxTrivia();
    mode = 'answer';
  }
  function bossResolve(right) {
    var i = quiz.head;
    if (right && i === boss.weak) {
      quiz.outcome = 'win'; quiz.reward = 'THE DRAGON FALLS!';
      sfxPickup();
    } else if (right) {
      boss.heads[i] = false;
      quiz.outcome = 'drop'; quiz.reward = 'HEAD ' + (i + 1) + ' FALLS!';
      sfxSlay();
    } else {
      // Wrong: a heart, and the head stays — no hint either way.
      if (missed.indexOf(quiz.q) === -1) missed.push(quiz.q);
      boss.hearts--;
      quiz.outcome = boss.hearts <= 0 ? 'lose' : 'hurt';
      quiz.reward = boss.hearts <= 0 ? 'YOU ARE DEFEATED' : 'WRONG!  -1 ♥';
      sfxHurt();
    }
  }
  function bossAfter(outcome) {                    // the result banner has closed
    quiz = null;

    else if (outcome === 'lose') bossLose();

  }
  function bossWin() {
    // The dragon is gone and the reserved cell behind the dais opens as stairs.
    var sx = dragon.x | 0, sy = (dragon.y | 0) + 1;
    MAP[sy] = MAP[sy].substr(0, sx) + '0' + MAP[sy].substr(sx + 1);
    stairs = { x: sx + 0.5, y: sy + 0.5, cx: sx, cy: sy };
    dragon = null; boss = null;
    score += 500;
    mode = 'explore';
    pickup = 'THE STAIRS ARE OPEN!'; pickupT = 0;
    sfxDoor();
    flash = 0.4;
  }
  function bossLose() {
    // Thrown out: the dragon door shuts again and the armor scatters across
    // ground you've already walked (so every piece is reachable). Other doors
    // stay as you left them; the key and the missed pool carry over.
    boss = null; mode = 'explore';
    dragonDoor.open = false; dragonDoor.opening = false; dragonDoor.anim = 0;
    px = dragonDoor.cx + 0.5; py = dragonDoor.cy - 0.5; ang = -Math.PI / 2;
    armorBits = 0;
    var occ = {};
    occ[(py | 0) * MW + (px | 0)] = 1;
    gates.forEach(function (g) { occ[(g.y | 0) * MW + (g.x | 0)] = 1; });
    chests.forEach(function (c) { if (!c.opened) occ[(c.y | 0) * MW + (c.x | 0)] = 1; });
    if (jester) occ[(jester.y | 0) * MW + (jester.x | 0)] = 1;
    if (merchant) occ[(merchant.y | 0) * MW + (merchant.x | 0)] = 1;
    var pool = [];
    for (var y = 1; y < bossRoom.y0 - 1; y++) for (var x = 1; x < MW - 1; x++) {
      var id = y * MW + x;
      if (visited[id] && !occ[id] && !doorMap[id] && cell(x, y) === 0) pool.push({ x: x + 0.5, y: y + 0.5 });
    }
    var chosen = [];
    for (var k = 0; k < armorItems.length && pool.length; k++) {   // spread out, like the original drop
      var bi = 0, bd = -1;
      for (var j = 0; j < pool.length; j++) {
        var m = Math.abs(pool[j].x - px) + Math.abs(pool[j].y - py);
        for (var c2 = 0; c2 < chosen.length; c2++) m = Math.min(m, Math.abs(pool[j].x - chosen[c2].x) + Math.abs(pool[j].y - chosen[c2].y));
        if (m > bd) { bd = m; bi = j; }
      }
      chosen.push(pool[bi]); pool.splice(bi, 1);
    }
    armorItems.forEach(function (it, k) {
      it.taken = false;
      if (chosen[k]) { it.x = chosen[k].x; it.y = chosen[k].y; }   // else it falls back where it first lay
    });
    pickup = 'ARMOR SCATTERED!'; pickupT = 0;
    flash = 0.4;
  }

  // ── Title / pause ──
  function leaveTitle() {
    if (performance.now() - startShownAt < 400) return;   // not the tap that lifted the veil
    mode = 'start'; startShownAt = performance.now();
  }
  function openPause() {
    mode = 'pause'; pauseSel = 0; pauseShownAt = performance.now();

    pauseHeldMusic = !!(music.ctx && music.ctx.state === 'running');
    if (pauseHeldMusic) music.ctx.suspend();

  function closePause() {
    mode = 'explore';

    pauseHeldMusic = false;
  }
  function pausePick(i) {
    var row = pauseRows()[i];
