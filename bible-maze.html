    else if (row === 'QUIT TO MAIN PAGE') window.location.href = homeHref();
  }
  function pauseTap(clientX, clientY) {
    if (!pauseRects || performance.now() - pauseShownAt < 300) return;
    var pt = canvasPt(clientX, clientY);
    for (var r = 0; r < pauseRects.length; r++) {
      var b = pauseRects[r];
      if (pt.x >= b.x0 && pt.x <= b.x1 && pt.y >= b.y0 && pt.y <= b.y1) { pauseSel = r; pausePick(r); return; }
    }
  }

  // ── Password entry / popup ──
  function pwPress(i) {                            // act on grid cell i (0..31 letters, then BACK/DEL/OK)
    pwCur = i;
    if (i < PW_ALPHA.length) { if (pwBuf.length < 8) { pwBuf += PW_ALPHA.charAt(i); pwMsg = ''; } return; }
    var b = PW_BTNS[i - PW_ALPHA.length];
    if (b === 'BACK') { mode = 'start'; startShownAt = performance.now(); return; }
    if (b === 'DEL') { pwBuf = pwBuf.slice(0, -1); pwMsg = ''; return; }
    pwSubmit();
  }
  function pwSubmit() {
    if (pwBuf.length < 8) { pwMsg = 'NEEDS 8 CHARACTERS'; return; }
    if (pwBuf === DEBUG_CODE) {                    // back to the menu with the dev keys live
      debug = true; debugNote = true;
      mode = 'start'; startShownAt = performance.now();
      sfxPickup(); return;
    }
    var d = decodePassword(pwBuf);
    if (!d) { pwMsg = 'WRONG PASSWORD'; sfxHurt(); return; }
    difficulty = DIFFS[d.diff].key;
    level = d.level; score = d.score; levelStartScore = d.score;
    hasKey = false; missed.length = 0;
    applyPalette(d.pal);
    generateFloor(newSeed());                      // a fresh floor at that depth
    mode = 'explore';
    pickup = 'LEVEL ' + level + ' RESUMED'; pickupT = 0;
    sfxPickup(); flash = 0.4;
  }
  function pwMove(dx, dy) {                        // grid cursor; the button row sits under the letters
    var nL = PW_ALPHA.length, rows = nL / PW_COLS, nB = PW_BTNS.length;
    if (pwCur < nL) {
      var r = (pwCur / PW_COLS) | 0, c = pwCur % PW_COLS;
      if (dx) pwCur = r * PW_COLS + (c + dx + PW_COLS) % PW_COLS;
      else if (dy < 0) pwCur = r > 0 ? pwCur - PW_COLS : nL + Math.min(nB - 1, (c * nB / PW_COLS) | 0);
      else pwCur = r < rows - 1 ? pwCur + PW_COLS : nL + Math.min(nB - 1, (c * nB / PW_COLS) | 0);
    } else {
      var bi = pwCur - nL;
      if (dx) pwCur = nL + (bi + dx + nB) % nB;
      else { var col = Math.min(PW_COLS - 1, Math.round((bi + 0.5) * PW_COLS / nB - 0.5)); pwCur = (dy < 0 ? (rows - 1) * PW_COLS : 0) + col; }
    }
  }
  function pwTap(clientX, clientY) {
    if (!pwRects || performance.now() - pwShownAt < 300) return;
    var pt = canvasPt(clientX, clientY);
    for (var i = 0; i < pwRects.length; i++) {
      var b = pwRects[i];
      if (pt.x >= b.x0 && pt.x <= b.x1 && pt.y >= b.y0 && pt.y <= b.y1) { pwPress(i); return; }
    }
  }
  function closePass() {
    if (!passPop || performance.now() - passPop.t0 < VERSE_GUARD) return;
    passPop = null; mode = 'explore';
  }

  // ── Armor verse popup ──
  function closeVerse() {
    if (!versePop || performance.now() - versePop.t0 < VERSE_GUARD) return;
    versePop = null; mode = 'explore';
    if (armorComplete()) { pickup = 'ARMOR COMPLETE!'; pickupT = 0; }
  }

  // ── Start screen ──
  function chooseDifficulty(i) {
    if (START_ROWS[i].key === 'password') {      // not a difficulty: open the entry grid
      mode = 'password'; pwBuf = ''; pwCur = 0; pwMsg = ''; pwShownAt = performance.now();
      return;
    }
    difficulty = DIFFS[i].key;
    mode = 'explore';
    startRects = null;
    pickup = DIFFS[i].label + ' MODE'; pickupT = 0;
    sfxPickup();
  }
  function startTap(clientX, clientY) {            // tap/click a row to choose it
    if (!startRects || performance.now() - startShownAt < 400) return;   // not the tap that lifted the veil
    var pt = canvasPt(clientX, clientY);
    for (var r = 0; r < startRects.length; r++) {
      var b = startRects[r];
      if (pt.x >= b.x0 && pt.x <= b.x1 && pt.y >= b.y0 && pt.y <= b.y1) { startSel = r; chooseDifficulty(r); return; }
    }
  }

  var lastInput = 'keys';       // 'keys' | 'touch' — whichever the player used last
  window.addEventListener('keydown', function (e) {
    lastInput = 'keys';
    if (mode === 'title') {
      if (running && (e.code === 'Space' || e.code === 'Enter')) { leaveTitle(); e.preventDefault(); }
      return;
    }
    if (mode === 'pause') {
      var nR = pauseRows().length;
      if (e.code === 'KeyW' || e.code === 'ArrowUp') pauseSel = (pauseSel + nR - 1) % nR;
      else if (e.code === 'KeyS' || e.code === 'ArrowDown') pauseSel = (pauseSel + 1) % nR;
      else if (e.code === 'Space' || e.code === 'Enter') pausePick(pauseSel);
      else if (e.code === 'Escape') closePause();
      e.preventDefault();
      return;
    }
    if (mode === 'password') {
      if (!running) return;
      var ch = (e.key || '').toUpperCase();
      if (e.code === 'ArrowLeft') pwMove(-1, 0);
      else if (e.code === 'ArrowRight') pwMove(1, 0);
      else if (e.code === 'ArrowUp') pwMove(0, -1);
      else if (e.code === 'ArrowDown') pwMove(0, 1);
      else if (e.code === 'Space') pwPress(pwCur);
      else if (e.code === 'Enter') pwSubmit();
      else if (e.code === 'Backspace') { pwBuf = pwBuf.slice(0, -1); pwMsg = ''; }
      else if (e.code === 'Escape') { mode = 'start'; startShownAt = performance.now(); }
      else if (ch.length === 1 && PW_ALPHA.indexOf(ch) >= 0) pwPress(PW_ALPHA.indexOf(ch));   // typed straight in
      e.preventDefault();
      return;
    }
    if (mode === 'passnote') {
      if (e.code === 'Space' || e.code === 'Enter' || e.code === 'Escape') { closePass(); e.preventDefault(); }
      return;
    }
    if (mode === 'verse') {
      if (e.code === 'Space' || e.code === 'Enter' || e.code === 'Escape') { closeVerse(); e.preventDefault(); }
      return;                                      // the popup swallows everything else
    }
    if (mode === 'start') {
      if (!running) return;                        // the veil is up; let the click start things
      if (e.code === 'KeyW' || e.code === 'ArrowUp') { startSel = (startSel + START_ROWS.length - 1) % START_ROWS.length; e.preventDefault(); }
      else if (e.code === 'KeyS' || e.code === 'ArrowDown') { startSel = (startSel + 1) % START_ROWS.length; e.preventDefault(); }
      else if (e.code === 'Space' || e.code === 'Enter') { chooseDifficulty(startSel); e.preventDefault(); }
      return;
    }
    if (mode === 'heads') {
      if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'KeyA' || e.code === 'ArrowLeft') { headStep(-1); e.preventDefault(); }
      else if (e.code === 'KeyS' || e.code === 'ArrowDown' || e.code === 'KeyD' || e.code === 'ArrowRight') { headStep(1); e.preventDefault(); }
      else if (e.code === 'Space' || e.code === 'Enter') { bossAsk(boss.sel); e.preventDefault(); }
      return;                        // the fight swallows everything else
    }
    if (mode === 'answer') {
      if (e.code === 'KeyW' || e.code === 'ArrowUp') { if (quiz && !quiz.result) quiz.sel = (quiz.sel + quiz.order.length - 1) % quiz.order.length; e.preventDefault(); }
      else if (e.code === 'KeyS' || e.code === 'ArrowDown') { if (quiz && !quiz.result) quiz.sel = (quiz.sel + 1) % quiz.order.length; e.preventDefault(); }
      else if (e.code === 'Space' || e.code === 'Enter') { confirmAnswer(); e.preventDefault(); }
      return;                        // swallow everything else while answering
    }
    // explore mode
    if (GAME_KEYS[e.code]) { keys[e.code] = true; e.preventDefault(); return; }
    if (e.code === 'Space') {                        // context action in range
      contextAction();
      e.preventDefault(); return;
    }
    if (e.code === 'Escape' || e.code === 'Enter') { openPause(); e.preventDefault(); return; }   // pause / quit menu
    // Music: M mutes/unmutes the Catacomb soundtrack — for everyone.
    if (e.code === 'KeyM') { musToggleMute(); e.preventDefault(); return; }
    if (!debug) return;              // every key below is a developer key (password DDDDDDDD)
    // Developer palette toggle: ] next, [ prev, P next, R random.
    if (e.code === 'BracketRight' || e.code === 'KeyP') { applyPalette(pal + 1); e.preventDefault(); }
    else if (e.code === 'BracketLeft') { applyPalette(pal - 1); e.preventDefault(); }
    else if (e.code === 'KeyR') { applyPalette((Math.random() * PALETTES.length) | 0); e.preventDefault(); }
    // Dev: G regenerates this floor (new seed, same depth); N dives one deeper.
    else if (e.code === 'KeyG') { hasKey = false; missed.length = 0; generateFloor(newSeed()); flash = 0.25; e.preventDefault(); }
    else if (e.code === 'KeyN') { descend(); e.preventDefault(); }
    // Secret: & (Shift+7) toggles trivia off, so chests just give their contents.
    // Checked before Digit7 below, since & shares that key code.
    else if (e.key === '&') { triviaOff = !triviaOff; pickup = 'TRIVIA ' + (triviaOff ? 'OFF' : 'ON'); pickupT = 0; e.preventDefault(); }
    // Dev: 1 grants/removes the FULL Armor of God (open the dragon door);
    // 4 grants/removes the key (open doors without finding its chest);
    // 7 stands in for the compass chest (needle + portals); 8 for the map
    // chest (pin the other chests); 9 for a correct jester answer (equipment).
    else if (e.code === 'Digit1') { var _full = armorComplete(); armorBits = _full ? 0 : armorTarget; pickup = 'ARMOR ' + (armorComplete() ? 'ON' : 'OFF'); pickupT = 0; e.preventDefault(); }
    else if (e.code === 'Digit4') { hasKey = !hasKey; pickup = 'KEY ' + (hasKey ? 'ON' : 'OFF'); pickupT = 0; e.preventDefault(); }
    else if (e.code === 'Digit7') { hasCompass = !hasCompass; e.preventDefault(); }
    else if (e.code === 'Digit8') { chestReveal = !chestReveal; e.preventDefault(); }
    else if (e.code === 'Digit9') { mapReveal = !mapReveal; e.preventDefault(); }
    // Dev: 0 brings the merchant in now (near you), ignoring how much you've walked.
    else if (e.code === 'Digit0') { if (!merchant) { merchantState = 'waiting'; if (!spawnMerchant(2)) { pickup = 'WALK MORE FIRST'; pickupT = 0; } } e.preventDefault(); }
  });
  window.addEventListener('keyup', function (e) {
    if (GAME_KEYS[e.code]) { keys[e.code] = false; e.preventDefault(); }
  });

  // ── Focus veil ─────────────────────────────────────────────────
  var veil = document.getElementById('veil');
  var running = false;
  function play() {
    if (running) return;
    running = true;
    veil.classList.add('hidden');
    startShownAt = performance.now();                // a tap this soon is the one that lifted the veil
    try { window.focus(); cv.focus(); } catch (e) {}
    // Audio may only begin inside a user gesture (this click). Unlock the
    // context, then start this world's track the first time; on later resumes
    // just wake the suspended context so the track continues where it paused.
    if (mode !== 'pause') music.unlock();            // the pause menu keeps the music stopped
    if (!musStarted) { musStarted = true; musPal = -1; musSwitch(pal); }
    else if (music.ctx && music.ctx.state === 'suspended' && mode !== 'pause') { music.ctx.resume(); }
    last = performance.now();
    requestAnimationFrame(frame);
  }
  function pause() {
    running = false;
    keys = {};
    touchReset();                        // drop any held thumb so it can't stick across a blur
    var vp = document.getElementById('vpass');

    var planeLen = Math.tan(FOV / 2);
    var planeX = -dirY * planeLen, planeY = dirX * planeLen;

    // ── Pass 1: cast, fill wall faces, lay horizontal courses ──
    for (var col = 0; col < W; col++) {
      var camX = 2 * col / W - 1;
      var rayX = dirX + planeX * camX;
      var rayY = dirY + planeY * camX;

      var mapX = px | 0, mapY = py | 0;
      var deltaX = Math.abs(1 / rayX), deltaY = Math.abs(1 / rayY);
      var stepX, stepY, sideX, sideY;
      if (rayX < 0) { stepX = -1; sideX = (px - mapX) * deltaX; }
      else { stepX = 1; sideX = (mapX + 1 - px) * deltaX; }
      if (rayY < 0) { stepY = -1; sideY = (py - mapY) * deltaY; }
      else { stepY = 1; sideY = (mapY + 1 - py) * deltaY; }

      var hit = 0, side = 0, val = 1, guard = 0;
      while (!hit && guard++ < 64) {
        if (sideX < sideY) { sideX += deltaX; mapX += stepX; side = 0; }
        else { sideY += deltaY; mapY += stepY; side = 1; }
        val = cell(mapX, mapY);
        if (val > 0) {
          // Mid-swing, the door is only solid where the leaf still is. For
          // the part it has already swung out of, let the ray pass THROUGH
          // so you see the passage behind it opening up (no dark pop).
          var dSwing = doorMap[mapY * MW + mapX];
          if (dSwing && !dSwing.open && dSwing.anim > 0) {
            var dh0 = side === 0 ? (sideX - deltaX) : (sideY - deltaY);
            var wc = side === 0 ? (py + dh0 * rayY) : (px + dh0 * rayX);
            wc -= Math.floor(wc);
            if (wc <= 1 - dSwing.anim) hit = 1;   // still leaf here → blocked
            // else: opening — keep marching to what's behind
          } else {
            hit = 1;
          }
        }
      }

      var dist = side === 0 ? (sideX - deltaX) : (sideY - deltaY);
      if (dist < 0.0001) dist = 0.0001;
      var lineH = (H / dist) | 0;
      var y0 = horizon - (lineH >> 1) + ((posZ / dist) | 0);   // crouch dips near walls most
      var y1 = y0 + lineH;

      // Where along the wall did we hit? (0..1 across this wall face) —
      // the wall-hit coordinate, same value texturing uses to place joints.
      var wall;
      if (side === 0) wall = py + dist * rayY;
      else wall = px + dist * rayX;
      wall -= Math.floor(wall);

      cTop[col] = y0; cBot[col] = y1; cVal[col] = val;
      cSide[col] = side; cHit[col] = wall; cDist[col] = dist;
      var dObj = doorMap[mapY * MW + mapX] || null;          // the door we stopped on, if any
      var isDoorCol = !!dObj;
      var isFalseWallCol = !!falseMap[mapY * MW + mapX];     // a crawl-through false wall?

      var vy0 = y0 < 0 ? 0 : y0, vy1 = y1 > H ? H : y1;

      // Ceiling for this column: always the DARK color with LIGHT speckles,
      // from the top of the screen down to the wall top. Dark-above is fixed
      // across all palettes so the player never feels flipped. Only where
      // ceiling actually shows (y0 > 0), so it never covers the wall.
      if (y0 > 0) {
        var cb = y0 > H ? H : y0;
        ctx.fillStyle = DARK;
        ctx.fillRect(col, 0, 1, cb);
        ctx.fillStyle = LIGHT;
        for (var cyy = 0; cyy < cb; cyy++) {
          var hsh = ((col * 73856093) ^ (cyy * 19349663)) >>> 0;
          if ((hsh & 1023) / 1024 < CEIL_SPECKLE) ctx.fillRect(col, cyy, 1, 1);
        }
      }

      // Floor for this column: always LIGHT-dominant with sparse DARK
      // speckles — the constant inverse of the ceiling, so up is always dark
      // and down is always light. Fill LIGHT explicitly (the frame's paper
      // fill may not match LIGHT in an inverted palette), then scatter DARK.
      if (y1 < H) {
        var ft = y1 < 0 ? 0 : y1;
        ctx.fillStyle = LIGHT;
        ctx.fillRect(col, ft, 1, H - ft);
        ctx.fillStyle = DARK;
        for (var fyy = ft; fyy < H; fyy++) {
          var fhsh = ((col * 73856093) ^ (fyy * 83492791)) >>> 0;
          if ((fhsh & 1023) / 1024 < FLOOR_SPECKLE) ctx.fillRect(col, fyy, 1, 1);
        }
      }

      // Depth dither on y-side walls (and far walls), so the two facings
      // read differently and distance adds a little tone — the "light
      // dither shading" pass. Kept subtle. (Skipped on the door face.)
      var dark = 0;
      if (side === 1) dark += 0.16;
      dark += Math.min(0.28, dist / MAX_DIST * 0.5);
      if (!isDoorCol && dark > 0.04) {
        ctx.fillStyle = INK;
        for (var yy = vy0; yy < vy1; yy++) {
          if (ditherOn(col, yy, dark)) ctx.fillRect(col, yy, 1, 1);
        }
      }

      if (isDoorCol) {
        // Draw the door face for this column. The leaf swings toward its
        // hinge (u=0) as it opens: it occupies u in [0, leafFrac], and the
        // vacated part is the DARK opening it swung into. When fully open the
        // cell reports as passable and the ray no longer stops here at all.
        var uu = cHit[col];                       // 0..1 across the door cell
        var leafFrac = 1 - dObj.anim;             // leaf width fraction
        var invHd = lineH > 0 ? 1 / lineH : 0;
        for (var dby = vy0; dby < vy1; dby++) {
          var vv = (dby - y0) * invHd;
          if (vv < 0) vv = 0; else if (vv > 1) vv = 1;
          var dcol;
          if (leafFrac > 0.02 && uu <= leafFrac) dcol = doorLeafColor(uu / leafFrac, vv);
          else dcol = DARK;                        // the opening behind the leaf
          if (dObj.dragon) dcol = (dcol === LIGHT) ? DARK : LIGHT;   // dragon door: inverted (placeholder art)
          ctx.fillStyle = dcol;
          ctx.fillRect(col, dby, 1, 1);
        }
      } else {
      // Brick, drawn per-column over this wall face. Everything is anchored
      // to the wall's TRUE height (the wall is 1 world-unit tall), not to
      // screen pixels, so the pattern holds still as you move.
      //
      //   v      = 0..1 down the wall face (world height fraction)
      //   course = which horizontal course a pixel is in (0..COURSES)
      //   running bond: odd courses shift half a brick sideways, so
      //   vertical joints alternate and never line up top-to-bottom.
      //
      // We ink a pixel when it sits on a course line (horizontal mortar) or
      // on a brick joint (vertical mortar) for its course. MORTAR is how
      // thick, in world fraction, a joint reads.
      ctx.fillStyle = INK;
      var invH = lineH > 0 ? 1 / lineH : 0;
      var hitU = cHit[col];                      // 0..1 across the wall face
      for (var by = vy0; by < vy1; by++) {
        var v = (by - y0) * invH;                // 0..1 down the wall
        if (v < 0 || v > 1) continue;
        // False wall: same brick as any wall, but with a dark arched tunnel at
        // the base (a dome) ringed by pale arch stones. Overpaints the brick.
        if (isFalseWallCol) {
          var dxh = (hitU - 0.5) / 0.24, yUp = (1 - v) / 0.40, rr = dxh * dxh + yUp * yUp;
          if (yUp >= 0) {
            if (rr <= 1.0) { ctx.fillStyle = DARK; ctx.fillRect(col, by, 1, 1); continue; }    // dark tunnel
            if (rr <= 1.46) {                                                                   // arch stones (voussoirs)
              var aa = Math.atan2(yUp, dxh);           // 0..PI around the dome
              var seg = aa / (Math.PI / 8);            // 8 segments
              var onSeg = Math.abs(seg - Math.round(seg)) < 0.085;   // dark line between stones
              ctx.fillStyle = onSeg ? DARK : LIGHT;
              ctx.fillRect(col, by, 1, 1); continue;
            }
            if (rr <= 1.64) { ctx.fillStyle = DARK; ctx.fillRect(col, by, 1, 1); continue; }    // dark outline vs brick
          }
          ctx.fillStyle = INK;                   // otherwise fall through to normal brick mortar
        }
        var courseF = v * COURSES;
        var course = courseF | 0;
        // horizontal mortar: near an integer course boundary
        var cfrac = courseF - course;
        var onCourse = (cfrac < MORTAR_V || cfrac > 1 - MORTAR_V) && course > 0 && course < COURSES;
        // vertical mortar: this course's brick grid, offset on odd courses
        var off = (course & 1) ? 0.5 / BRICKS_ACROSS : 0;
        var bx = ((hitU + off) % 1 + 1) % 1;      // wrapped brick coordinate
        var bf = bx * BRICKS_ACROSS;
        var bfrac = bf - (bf | 0);
        var onJoint = bfrac < MORTAR_H || bfrac > 1 - MORTAR_H;
        if (onCourse || onJoint) ctx.fillRect(col, by, 1, 1);
      }
      }
    }

    // ── Pass 2: ink the edges ──
    ctx.fillStyle = INK;
    function vline(x, a, b) {
      if (a > b) { var t = a; a = b; b = t; }
      if (a < 0) a = 0; if (b > H) b = H;
      if (b > a) ctx.fillRect(x, a, 1, b - a);
    }
    for (var x = 0; x < W; x++) {
      var top = cTop[x], bot = cBot[x];

      // Wall silhouette: top and bottom outline of the wall band.
      if (top >= 0 && top < H) ctx.fillRect(x, top, 1, 1);
      if (bot >= 0 && bot < H) ctx.fillRect(x, bot - 1, 1, 1);

      // Vertical seam where the wall depth jumps between neighboring
      // columns (a corner) — draw a full-height edge there.
      if (x > 0) {
        var dPrev = cDist[x - 1], dHere = cDist[x];
        var jump = Math.abs(dHere - dPrev);
        var valChange = cVal[x] !== cVal[x - 1];
        var sideChange = cSide[x] !== cSide[x - 1];
        if (jump > 0.3 || valChange || sideChange) {
          // outline the nearer wall's edge (taller band)
          var tt = Math.min(top, cTop[x - 1]), bb = Math.max(bot, cBot[x - 1]);
          vline(x, tt, bb);
        }
      }
    }

    // (No blanket horizon line: the ceiling now ends at each column's wall
    // top, and the wall silhouette edges already ink the floor/wall and
    // ceiling/wall boundaries. A full-width line here would cut across any
    // wall that rises above the horizon.)

    drawSprites(horizon);
    if (flash > 0) {                     // portal flash: quick LIGHT wash
      ctx.globalAlpha = Math.min(0.7, flash / 0.22 * 0.7);
      ctx.fillStyle = LIGHT;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
    drawUI();
  }

  // ── Sprites (chests + gates), one depth-sorted pass ─────────────
  // Every billboarded object goes through here so they draw farthest-first
  // and correctly overlap EACH OTHER (a nearer gate hides a farther chest).
  // Each still depth-tests per-column against the walls (cDist) as it draws.
  function drawSprites(horizon) {
    var dirX = Math.cos(ang), dirY = Math.sin(ang);
    var planeLen = Math.tan(FOV / 2);
    var planeX = -dirY * planeLen, planeY = dirX * planeLen;
    var invDet = 1 / (planeX * dirY - dirX * planeY);

    // Gather all visible sprites with their squared distance.
    var list = [];
    dragonBox = null;
    if (stairs) {                                      // flush against the back wall of its cell
      var sty = stairs.cy + 0.92, dxs = stairs.x - px, dys = sty - py;
      list.push({ kind: 'stairs', o: { x: stairs.x, y: sty }, d: dxs * dxs + dys * dys });
    }
    for (var c = 0; c < chests.length; c++) {
      if (chests[c].opened) continue;
      var dxc = chests[c].x - px, dyc = chests[c].y - py;
      list.push({ kind: 'chest', o: chests[c], d: dxc * dxc + dyc * dyc });
    }
    for (var g = 0; g < gates.length; g++) {
      var dxg = gates[g].x - px, dyg = gates[g].y - py;
      list.push({ kind: 'gate', o: gates[g], d: dxg * dxg + dyg * dyg });
    }
    for (var ar = 0; ar < armorItems.length; ar++) {
      if (armorItems[ar].taken) continue;
      var dxr = armorItems[ar].x - px, dyr = armorItems[ar].y - py;
      list.push({ kind: 'armor', o: armorItems[ar], d: dxr * dxr + dyr * dyr });
    }
    if (merchant) {
      var dxm = merchant.x - px, dym = merchant.y - py;
      list.push({ kind: 'merchant', o: merchant, d: dxm * dxm + dym * dym });
    }
    if (jester) {
      var dxj = jester.x - px, dyj = jester.y - py;
      list.push({ kind: 'jester', o: jester, d: dxj * dxj + dyj * dyj });
    }
    if (dragon) {
      var dxd = dragon.x - px, dyd = dragon.y - py;
      list.push({ kind: 'dragon', o: dragon, d: dxd * dxd + dyd * dyd });
    }
    // Once opened, leave the swung-aside door leaf as a remnant — proof you
    // changed the world here. It's tucked hard against the north wall of the
    // doorway so it reads as flush (not floating in the passage), and it's
    // purely visual (no collision).
    for (var od = 0; od < doors.length; od++) {
      var dl = doors[od];
      if (!dl.open) continue;
      // Tuck the leaf against the doorway's side wall so it reads flush: north
      // wall for an E-W passage, west wall for an N-S one.
      var lfx = dl.axis === 'ns' ? dl.cx + 0.04 : dl.cx + 0.5;
      var lfy = dl.axis === 'ns' ? dl.cy + 0.5 : dl.cy + 0.04;
      var dxl = lfx - px, dyl = lfy - py;
      list.push({ kind: 'doorleaf', o: { x: lfx, y: lfy }, d: dxl * dxl + dyl * dyl });
    }
    list.sort(function (a, b) { return b.d - a.d; });   // farthest first

    for (var i = 0; i < list.length; i++) {
      var s = list[i], obj = s.o;
      var relX = obj.x - px, relY = obj.y - py;
      var tx = invDet * (dirY * relX - dirX * relY);
      var ty = invDet * (-planeY * relX + planeX * relY);
      if (ty <= 0.05) continue;                          // behind the camera
      var lineH = H / ty;
      var screenX = (W / 2) * (1 + tx / ty);

      if (s.kind === 'chest') {
        var size = (lineH * 0.55) | 0;
        if (size < 2) continue;
        var cw = size, chh = (size * 0.72) | 0;
        var cleft = (screenX - (cw >> 1)) | 0;
        var cbottom = (horizon + lineH / 2 + posZ / ty) | 0;
        drawChestSprite(obj, cleft, cbottom - chh, cw, chh, ty);
      } else if (s.kind === 'gate') {
        var gh = (lineH * 1.0) | 0;
        if (gh < 4) continue;
        var gw = (gh * 0.62) | 0;
        var gleft = (screenX - (gw >> 1)) | 0;
        var gbottom = (horizon + lineH / 2 + posZ / ty) | 0;
        drawGateSprite(gleft, gbottom - gh, gw, gh, ty);
      } else if (s.kind === 'armor') {
        var asz = (lineH * 0.4) | 0;
        if (asz < 4) continue;
        var abottom = (horizon + lineH / 2 + posZ / ty) | 0;
        // float the piece a little off the floor, centred on its spot
        drawArmorPickup(obj.bit, screenX | 0, abottom - asz - (lineH * 0.22 | 0), asz, ty);
      } else if (s.kind === 'jester') {
        var jh = (lineH * 1.0) | 0;
        if (jh < 8) continue;
        var jw = (jh * (JESTER_W / JESTER_H)) | 0;   // keep the sprite's true aspect
        var jleft = (screenX - (jw >> 1)) | 0;
        var jbottom = (horizon + lineH / 2 + posZ / ty) | 0;
        drawJesterSprite(jleft, jbottom - jh, jw, jh, ty);
      } else if (s.kind === 'merchant') {
        var mh = (lineH * MERCHANT_H / JESTER_H) | 0;   // same pixel size as the jester's art
        if (mh < 8) continue;
        var mw = (mh * (MERCHANT_W / MERCHANT_H)) | 0;
        var mleft = (screenX - (mw >> 1)) | 0;
        var mbottom = (horizon + lineH / 2 + posZ / ty) | 0;
        drawMerchantSprite(mleft, mbottom - mh, mw, mh, ty);
      } else if (s.kind === 'dragon') {
        var dgh = (lineH * 1.35) | 0;                 // the boss looms taller than a wall
        if (dgh < 10) continue;
        var dgw = (dgh * (DRAGON_W / DRAGON_H)) | 0;  // keep the sprite's true aspect
        var dgleft = (screenX - (dgw >> 1)) | 0;
        var dgbottom = (horizon + lineH / 2 + posZ / ty) | 0;
        drawDragonSprite(dgleft, dgbottom - dgh, dgw, dgh, ty);
        dragonBox = { left: dgleft, top: dgbottom - dgh, w: dgw, h: dgh };
      } else if (s.kind === 'stairs') {
        var sh = (lineH * 0.9) | 0;
        if (sh < 4) continue;
        var sw = (lineH * 0.8) | 0;
        var sleft = (screenX - (sw >> 1)) | 0;
        var sbottom = (horizon + lineH / 2 + posZ / ty) | 0;
        drawStairsSprite(sleft, sbottom - sh, sw, sh, ty);
      } else {
        // door leaf remnant: a thin standing door panel against the wall.
        var lh = (lineH * 0.95) | 0;
        if (lh < 4) continue;
        var lw = Math.max(2, (lineH * 0.10) | 0);
        var lleft = (screenX - (lw >> 1)) | 0;
        var lbottom = (horizon + lineH / 2 + posZ / ty) | 0;
        drawDoorLeafSprite(lleft, lbottom - lh, lw, lh, ty);
      }
    }
  }

  // Armor piece — a placeholder relic: a LIGHT plaque with a DARK border and the
  // piece's letter (A–F) stamped in the middle. Depth-tested per column like the
  // other billboards. Real art comes later; the letter stands in for it.
  // Armor sprites baked from the sheet, in reading order (bit 0..5):
  // helmet, shield, shoes, breastplate, sword, belt. '#' ink, '+' light outline, '.' clear.
  var ARMOR_ART = [
    { w: 7, h: 8, rows: ["+++++++", "+#####+", "+#####+", "+#####+", "+#+++#+", "+##+##+", "+##+##+", "+++++++"] },  // 0 helmet

    { w: 7, h: 6, rows: ["+++.+++", "+#+++#+", "+#####+", "+##+##+", "++###++", ".+++++."] }   // 5 belt
  ];
  // World pickups — the six pieces as you find them lying in the maze, larger

  var ARMOR_WORLD_ART = [

    { w: 16, h: 26, rows: [  // 4 sword of the Spirit

    for (var sy = top - 1; sy < top + h + 1; sy++) {

        var color = (du < 0 || du >= 1 || v < 0 || v >= 1) ? DARK : doorLeafColor(du, v);
        ctx.fillStyle = color;

  function drawGateSprite(left, top, w, h, depth) {
    var cx = left + w / 2, cy = top + h / 2;
    // Inset the ellipse inside its box so the DARK halo (out to r2 = 1.28)
    // has room on ALL sides. If the ellipse filled the box, its widest points
    // would touch the edges with no room for the halo, and the left/right of
    // the oval would look sliced flat — which is the clipping you saw.
    var rx = (w / 2) * 0.84, ry = (h / 2) * 0.84;
    var tphase = (gameTime * 9) | 0;              // shimmer changes ~9x/sec
    for (var sy = top; sy < top + h; sy++) {
      if (sy < 0 || sy >= H) continue;
      for (var sx = left; sx < left + w; sx++) {
        if (sx < 0 || sx >= W) continue;
        if (depth >= cDist[sx]) continue;         // behind a nearer wall
        var nx = (sx - cx) / rx, ny = (sy - cy) / ry, r2 = nx * nx + ny * ny;
        if (r2 > 1.28) continue;                  // outside the portal
        var color;
        if (r2 > 1.0) color = DARK;               // halo just outside the rim
        else if (r2 > 0.82) color = LIGHT;        // glowing rim
        else {
          // interior: dark portal with animated LIGHT sparks
          var hsh = ((sx * 92821) ^ (sy * 68917) ^ (tphase * 40503)) >>> 0;
          color = ((hsh & 255) / 256 < 0.14) ? LIGHT : DARK;
        }
        ctx.fillStyle = color;
        ctx.fillRect(sx, sy, 1, 1);
      }
    }
  }

  // ── Door face (drawn on the door's WALL cell) ───────────────────
  // A plank door in the two colours: DARK wood boards with LIGHT grain and
  // seams, two LIGHT wrought-iron STRAP HINGES (spearhead tip, riveted bar,
  // scrolled terminal), and a central barrel BOLT whose keyhole glows LIGHT
  // when you hold the key. du = 0..1 across the leaf, v = 0..1 down it. The
  // wall pass calls this per pixel; the swing squashes the leaf toward its
  // hinge as it opens (see the wall pass).
  function doorLeafColor(du, v) {
    // Mirror across so the scroll/hinge hardware sits on the edge the leaf
    // pivots from (du = 0), and the bolt/lock on the free latch edge — the door
    // then swings toward its visible hinges from either side.
    du = 1 - du;
    // Bright iron frame around the whole leaf.
    if (du < 0.07 || du > 0.93 || v < 0.03 || v > 0.97) return LIGHT;

    // Central barrel bolt (the lock): a thick bar, a raised knob, and a keyhole.
    if (Math.abs(v - 0.5) < 0.045 && du > 0.06 && du < 0.40) return LIGHT;      // bolt bar
    if (du > 0.14 && du < 0.27 && v > 0.39 && v < 0.61) {                       // knob block
      var kx = du - 0.205, ky = v - 0.5;
      if (kx * kx + ky * ky < 0.0011) return hasKey ? LIGHT : DARK;             // keyhole (glows with key)
      return LIGHT;
    }

    // Two strap hinges: spearhead (left) → riveted bar → scroll terminal (right).
    var straps = [0.26, 0.74];
    for (var si = 0; si < 2; si++) {
      var dv = v - straps[si];
      if (Math.abs(dv) < 0.042 && du > 0.17 && du < 0.80) {                     // the bar
        if ((Math.abs(du - 0.36) < 0.018 || Math.abs(du - 0.60) < 0.018) && Math.abs(dv) < 0.022)
          return DARK;                                                          // forged rivets
        return LIGHT;
      }
      if (du >= 0.07 && du <= 0.17) {                                           // spearhead tip
        if (Math.abs(dv) < 0.085 * (du - 0.07) / 0.10) return LIGHT;
      }
      var cx = du - 0.82, cy = dv, r2 = cx * cx + cy * cy;                      // scroll terminal (a ring)
      if (r2 < 0.0050 && r2 > 0.0015) return LIGHT;
      if (Math.abs(du - 0.82) < 0.014 && cy > 0 && cy < 0.085) return LIGHT;    // scroll hook
    }

    // Wood: bright plank seams, a little grain, and a fixed speckle for flavour.
    if (Math.abs(du - 0.30) < 0.010 || Math.abs(du - 0.52) < 0.010 || Math.abs(du - 0.74) < 0.010) return LIGHT;
    var col = (du * 46) | 0, gh = ((col * 2654435761) >>> 0);                   // stable per board-column
    if (gh % 7 === 0) {                                                         // ~1 in 7 columns carries grain
      var seg = (v * 11) | 0;
      if (((gh ^ (seg * 40503)) >>> 0) % 5 < 2) return LIGHT;                   // dashed vertical grain
    }
    // Speckle, the same trick as the ceiling — LIGHT flecks on the dark boards,
    // keyed to the door SURFACE (du,v) so they hold still instead of shimmering.
    var spx = (du * 72) | 0, spy = (v * 112) | 0;
    var sph = ((spx * 73856093) ^ (spy * 19349663)) >>> 0;
    if ((sph & 1023) / 1024 < DOOR_SPECKLE) return LIGHT;
    return DARK;                                                               // plank wood
  }

  // ── Bitmap pixel font ───────────────────────────────────────────
  // A real 5x7 pixel font, drawn from pixels like the walls — no web font,
  // no external request, stays self-contained and light. Each glyph is 7
  // numbers, one per row; the low 5 bits are the columns (leftmost = bit 4).
  // Text is UPPERCASED on draw (classic arcade look, and it halves the glyph
  // set). Chunkiness is the `scale` argument: each font pixel becomes a
  // scale x scale block, so there's no upper limit on how chunky it gets.
  var FONT = {
    "0":[14,17,19,21,25,17,14],"1":[4,12,4,4,4,4,14],"2":[14,17,1,6,8,16,31],
    "3":[31,2,4,2,1,17,14],"4":[2,6,10,18,31,2,2],"5":[31,16,30,1,1,17,14],
    "6":[14,16,16,30,17,17,14],"7":[31,1,2,4,8,8,8],"8":[14,17,17,14,17,17,14],
    "9":[14,17,17,15,1,1,14]," ":[0,0,0,0,0,0,0],
    "A":[14,17,17,31,17,17,17],"B":[30,17,17,30,17,17,30],"C":[14,17,16,16,16,17,14],
    "D":[30,17,17,17,17,17,30],"E":[31,16,16,30,16,16,31],"F":[31,16,16,30,16,16,16],
    "G":[14,17,16,23,17,17,14],"H":[17,17,17,31,17,17,17],"I":[14,4,4,4,4,4,14],
    "J":[7,2,2,2,2,18,12],"K":[17,18,20,24,20,18,17],"L":[16,16,16,16,16,16,31],
    "M":[17,27,21,21,17,17,17],"N":[17,25,21,19,17,17,17],"O":[14,17,17,17,17,17,14],
    "P":[30,17,17,30,16,16,16],"Q":[14,17,17,17,21,18,13],"R":[30,17,17,30,20,18,17],
    "S":[15,16,16,14,1,1,30],"T":[31,4,4,4,4,4,4],"U":[17,17,17,17,17,17,14],
    "V":[17,17,17,17,17,10,4],"W":[17,17,17,21,21,27,17],"X":[17,17,10,4,10,17,17],
    "Y":[17,17,10,4,4,4,4],"Z":[31,1,2,4,8,16,31],
    ".":[0,0,0,0,0,12,12],",":[0,0,0,0,12,12,8],"!":[4,4,4,4,4,0,4],
    "?":[14,17,1,6,4,0,4],"'":[4,4,8,0,0,0,0],"\"":[10,10,10,0,0,0,0],
    "-":[0,0,0,31,0,0,0],":":[0,12,12,0,12,12,0],";":[0,12,12,0,12,12,8],"/":[1,2,4,4,8,16,16],
    ">":[16,8,4,2,4,8,16],"(":[6,8,8,8,8,8,6],")":[12,2,2,2,2,2,12],
    "+":[0,4,4,31,4,4,0],
    "◈":[14,10,14,4,4,6,4],"✓":[0,1,2,4,20,24,0],
    "↑":[4,14,21,4,4,4,0],"↓":[4,4,4,21,14,4,0],
    "♥":[0,10,31,31,14,4,0],"♡":[0,10,21,17,10,4,0]
  };
  var GW = 5, GH = 7, GADV = 6;      // glyph width, height, advance (incl. 1px gap)

  function glyph(ch, x, y, s, color) {
    var g = FONT[ch] || FONT[' '];
    ctx.fillStyle = color;
    for (var row = 0; row < GH; row++) {
      var bits = g[row];
      for (var col = 0; col < GW; col++)
        if (bits & (1 << (GW - 1 - col))) ctx.fillRect(x + col * s, y + row * s, s, s);
    }
  }
  function textW(str, s) { return (str.length * GADV - 1) * s; }   // px width at scale s
  function bit(str, x, y, color, s, align) {
    str = ('' + str).toUpperCase();
    var sx = x;
    if (align === 'center') sx = x - (textW(str, s) >> 1);
    else if (align === 'right') sx = x - textW(str, s);
    for (var i = 0; i < str.length; i++) glyph(str[i], (sx + i * GADV * s) | 0, y | 0, s, color);
  }
  // Same, with a DARK outline `ring` font-pixels thick all around (ring*s px).
  function bitOut(str, x, y, fill, s, align, ring) {
    ring = (ring || 1) * s;
    for (var dx = -ring; dx <= ring; dx += s)
      for (var dy = -ring; dy <= ring; dy += s)
        if (dx || dy) bit(str, x + dx, y + dy, DARK, s, align);
    bit(str, x, y, fill, s, align);
  }

  // ── UI overlays ─────────────────────────────────────────────────
  // Everything is drawn in the two palette colors, in the pixel font, so it
  // matches the world. Body text scale SB; headline (score/banner) scale SH.
  var SB = 2, SH = 3;
  function panel(x, y, w, h) {
    // A LIGHT panel with a DARK border and a 2px DARK halo, so it reads on
    // any floor. Used for both the "open" hint and the trivia box.
    ctx.fillStyle = DARK;
    ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
    ctx.fillStyle = LIGHT;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = DARK;
    ctx.fillRect(x, y, w, 2);
    ctx.fillRect(x, y + h - 2, w, 2);
    ctx.fillRect(x, y, 2, h);
    ctx.fillRect(x + w - 2, y, 2, h);
  }

  // Minimap: a framed window of the fog-revealed trail (cells you've stood in),
  // the boss room excluded, a blinking player blip and, when revealed, blinking
  // equipment marks. Returns its top Y so LEVEL can sit above it.
  // A chunky compass rose drawn beside the map: a dark diamond bezel, a light
  // cardinal outline (top point = north, matching the north-up map) and a needle
  // pointing where you're facing. Every logical pixel is an `sc`x`sc` block so it
  // reads bold and stays crisp — no anti-aliasing.
  function drawCompass(cx, cy, r, sc) {
    function blk(ox, oy) { ctx.fillRect(cx + ox * sc, cy + oy * sc, sc, sc); }   // logical pixel -> block
    ctx.fillStyle = DARK;                                   // filled diamond backing (radius r+1)
    for (var yy = -r - 1; yy <= r + 1; yy++) {
      var hw = (r + 1) - Math.abs(yy); if (hw < 0) continue;
      ctx.fillRect(cx - hw * sc, cy + yy * sc, (hw * 2 + 1) * sc, sc);
    }
    ctx.fillStyle = LIGHT;                                  // cardinal-point outline
    for (var k = 0; k <= r; k++) { blk(-k, -(r - k)); blk(k, -(r - k)); blk(-k, r - k); blk(k, r - k); }
    var dx = Math.cos(ang), dy = Math.sin(ang);            // heading (map is north-up, y grows south)
    var tx = dx * (r - 1), ty = dy * (r - 1);
    var steps = Math.max(1, Math.max(Math.abs(tx), Math.abs(ty)) | 0);
    for (var s = 0; s <= steps; s++) blk(Math.round(tx * s / steps), Math.round(ty * s / steps));   // needle
    blk(Math.round(tx + Math.cos(ang + 2.5) * 2), Math.round(ty + Math.sin(ang + 2.5) * 2));        // arrowhead barbs
    blk(Math.round(tx + Math.cos(ang - 2.5) * 2), Math.round(ty + Math.sin(ang - 2.5) * 2));
    ctx.fillStyle = DARK; blk(0, 0);                       // hub
  }

  var mapBox = null;           // the minimap's (and compass's) footprint this frame: {left, bottom}
  function drawMinimap(rightX, topY) {
    var mazeRows = bossRoom ? bossRoom.y0 : MH;      // leave the boss room off the map
    if (!visited || mazeRows < 1) return topY;
    var cs = Math.min(2, (64 / MW) | 0, (64 / mazeRows) | 0); if (cs < 1) cs = 1;
    var mw = MW * cs, mh = mazeRows * cs, x0 = rightX - mw, y0 = topY;
    var pad = 3, bw = 2;                                                          // field padding + border width
    mapBox = { left: x0 - pad - (hasCompass ? 32 : 0), bottom: y0 + mh + pad };   // so banners can steer clear
    ctx.fillStyle = DARK; ctx.fillRect(x0 - pad, y0 - pad, mw + pad * 2, mh + pad * 2);   // field
    ctx.fillStyle = LIGHT;                                                        // 2px frame
    ctx.fillRect(x0 - pad, y0 - pad, mw + pad * 2, bw);
    ctx.fillRect(x0 - pad, y0 + mh + pad - bw, mw + pad * 2, bw);
    ctx.fillRect(x0 - pad, y0 - pad, bw, mh + pad * 2);
    ctx.fillRect(x0 + mw + pad - bw, y0 - pad, bw, mh + pad * 2);
    for (var r = 0; r < mazeRows; r++) {                                          // the walked trail
      var base = r * MW;
      for (var c = 0; c < MW; c++) if (visited[base + c]) ctx.fillRect(x0 + c * cs, y0 + r * cs, cs, cs);
    }
    // All revealed markers share ONE blink; the player blinks faster (but not
    // frantic) so it stays the thing your eye tracks. Each toggles LIGHT/DARK so
    // it reads on fog OR on trail.
    var blink = (((gameTime * 4) | 0) & 1) === 0;    // markers: one common rate
    var blinkP = (((gameTime * 8) | 0) & 1) === 0;   // player: the faster of the two
    ctx.fillStyle = blink ? LIGHT : DARK;
    if (mapReveal) {                                                              // revealed equipment
      for (var i = 0; i < armorItems.length; i++) {
        var a = armorItems[i]; if (a.taken) continue;
        var ar = a.y | 0; if (ar < mazeRows) ctx.fillRect(x0 + (a.x | 0) * cs, y0 + ar * cs, cs, cs);
      }
    }
    if (chestReveal) {                                                            // revealed chests
      for (var ci = 0; ci < chests.length; ci++) {
        var ch = chests[ci]; if (ch.opened) continue;
        var chr = ch.y | 0; if (chr < mazeRows) ctx.fillRect(x0 + (ch.x | 0) * cs, y0 + chr * cs, cs, cs);
      }
    }
    if (hasCompass) {                                                             // compass pins the portals
      for (var gi2 = 0; gi2 < gates.length; gi2++) {
        var gr = gates[gi2].y | 0; if (gr < mazeRows) ctx.fillRect(x0 + (gates[gi2].x | 0) * cs, y0 + gr * cs, cs, cs);
      }
    }
    var pr = py | 0;                                                              // player blip (no facing)
    if (pr < mazeRows) { ctx.fillStyle = blinkP ? DARK : LIGHT; ctx.fillRect(x0 + (px | 0) * cs, y0 + pr * cs, cs, cs); }
    if (hasCompass) drawCompass(x0 - pad - 16, y0 + (mh >> 1), 6, 2);             // chunky heading needle beside the map
    return y0;
  }

  function drawUI() {
    if (mode === 'answer' && quiz) { drawQuiz(); return; }
    if (mode === 'heads' && boss) { drawHeads(); return; }
    if (mode === 'start') { drawStart(); return; }
    if (mode === 'title') { drawTitle(); return; }
    if (mode === 'pause') { drawPause(); return; }
    if (mode === 'verse' && versePop) { drawVerse(); return; }
    if (mode === 'password') { drawPassword(); return; }
    if (mode === 'passnote' && passPop) { drawPassNote(); return; }
    // Explore: show a context prompt for whatever's in range (gate, then
    // door, then chest).
    var label = null;
    var nd = nearestDoor();
    if (nearestGate()) label = 'SPACE  ENTER GATE';
    else if (nd) {
      if (nd.dragon) label = armorComplete() ? 'SPACE  FACE THE DRAGON'
                                             : ('DRAGON DOOR - ARMOR ' + bitCount(armorBits) + '/6');
      else label = hasKey ? 'SPACE  OPEN DOOR' : 'LOCKED - NEED KEY';
    }
    else if (nearestOpenable()) label = 'SPACE  OPEN';
    else if (nearJester()) label = 'SPACE  TALK TO JESTER';
    else if (nearMerchant()) label = 'SPACE  TALK TO MERCHANT';
    else if (stairs && Math.abs(stairs.x - px) + Math.abs(stairs.y - py) < 2.2) label = 'WALK IN TO DESCEND';
    else if (!keys.ArrowDown && lastInput !== 'touch') {   // near a crawl wall, standing, on a keyboard? (touch just drives in)
      for (var fi = 0; fi < falseWalls.length; fi++) {
        var f = falseWalls[fi], dfx = (f.cx + 0.5) - px, dfy = (f.cy + 0.5) - py;
        if (dfx * dfx + dfy * dfy < 1.7) { label = 'HOLD ↓ TO CRAWL'; break; }
      }
    }
    // HUD corners: SCORE top-right with the minimap under it, LEVEL bottom-
    // right, and ONE row along the bottom-left: the six armor slots, then the
    // key and any merchant hearts. Keeping it to a single row leaves the strip
    // just above it free for the action prompt.
    var lh = GH * SB;
    mapBox = null;
    bitOut('SCORE ' + score, W - 5, 5, LIGHT, SB, 'right', 1);            // top right
    drawMinimap(W - 8, 5 + lh + 7);                                       // minimap under SCORE
    bitOut('LEVEL ' + level, W - 5, H - lh - 5, LIGHT, SB, 'right', 1);   // bottom right

    var ascale = 2, maxIH = 0;
    for (var m = 0; m < 6; m++) maxIH = Math.max(maxIH, ARMOR_ART[m].h * ascale);
    var rowBot = H - 5, ax = 5;
    for (var mi = 0; mi < 6; mi++) {                 // armor: filled once collected, a dash until then
      var art = ARMOR_ART[mi], iw = art.w * ascale;
      if (armorBits & (1 << mi)) drawHudArmorIcon(art, ax, rowBot - art.h * ascale, ascale);
      else bitOut('-', ax + (iw >> 1), rowBot - lh, LIGHT, SB, 'center', 1);
      ax += iw + 3;
    }
    ax += 5;
    if (hasKey) { bitOut('◈', ax, rowBot - lh, LIGHT, SB, 'left', 1); ax += textW('◈', SB) + 9; }
    if (bonusHearts) bitOut('♥+' + bonusHearts, ax, rowBot - lh, LIGHT, SB, 'left', 1);

    // The action prompt sits just above that row, drawn last so nothing covers it.
    if (label) {
      var pad = 6;
      var w = textW(label, SB) + pad * 2, h = GH * SB + pad * 2;
      var x = (W - w) >> 1, y = rowBot - maxIH - h - 6;
      panel(x, y, w, h);
      bit(label, x + pad, y + pad, DARK, SB);
    }

    // Pickup banner, near the top for a beat: centred in the space left of the
    // minimap when it fits there, otherwise just below the minimap.
    if (pickup) {
      var pw = textW(pickup, SB) + 4;
      if (!mapBox) bitOut(pickup, W >> 1, 26, LIGHT, SB, 'center', 1);
      else if (pw <= mapBox.left - 8) bitOut(pickup, mapBox.left >> 1, 26, LIGHT, SB, 'center', 1);
      else bitOut(pickup, W >> 1, mapBox.bottom + 6, LIGHT, SB, 'center', 1);
    }
  }

  // The armor popup: the piece's art and name with its reference, how many of
  // the six you hold, then the verse. Everything sizes from the verse length.
  function drawVerse() {
    var info = ARMOR_INFO[versePop.bit], art = ARMOR_WORLD_ART[versePop.bit];
    ctx.fillStyle = DARK; ctx.globalAlpha = 0.28; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
    var pad = 8, x = 10, boxW = W - 20, lh = GH * SB, lineH = lh + 4;
    var artH = 30, artW = (artH * art.w / art.h) | 0;
    var lines = wrapBits('"' + info.verse + '"', boxW - pad * 2, SB);
    var boxH = pad + artH + 8 + lines.length * lineH - 4 + pad;
    var footH = lh + 8;
    var y = (H - boxH - footH) >> 1;
    panel(x, y, boxW, boxH);
    blitSprite(art.rows, art.w, art.h, x + pad, y + pad, artW, artH, 0);   // depth 0: never hidden
    var tx = x + pad + artW + 8;
    bit(info.name, tx, y + pad + 1, DARK, SB);
    bit(info.ref, tx, y + pad + lh + 3, DARK, SB);
    bit(bitCount(armorBits) + '/6', x + boxW - pad, y + pad + 1, DARK, SB, 'right');
    var ty = y + pad + artH + 8;
    for (var i = 0; i < lines.length; i++) { bit(lines[i], x + pad, ty, DARK, SB); ty += lineH; }
    if (performance.now() - versePop.t0 >= VERSE_GUARD)
      bitOut('SPACE/TAP TO CONTINUE', W >> 1, y + boxH + 8, LIGHT, SB, 'center', 1);
  }

  // Title: the art centred near the top, prompt underneath.
  // The title is the one screen outside the floor palettes: pure black, with
  // the art (and prompt) in a colour picked at random on each page load —
  // any hue, kept bright enough to read on black.
  var TITLE_INK = 'hsl(' + ((Math.random() * 360) | 0) + ',' + (65 + ((Math.random() * 30) | 0)) + '%,' +
                  (58 + ((Math.random() * 14) | 0)) + '%)';
  function drawTitle() {
    var keepDark = DARK;
    DARK = '#000';                                   // bitOut's outline ring uses DARK
    ctx.fillStyle = DARK; ctx.fillRect(0, 0, W, H);
    var ox = (W - TITLE_W) >> 1, oy = 8;
    ctx.fillStyle = TITLE_INK;
    for (var y = 0; y < TITLE_H; y++) {
      var run = -1, base = y * TITLE_W;
      for (var x = 0; x <= TITLE_W; x++) {
        var on = x < TITLE_W && titlePix[base + x];
        if (on && run < 0) run = x;
        else if (!on && run >= 0) { ctx.fillRect(ox + run, oy + y, x - run, 1); run = -1; }
      }
    }
    bitOut('SPACE / TAP TO BEGIN', W >> 1, H - GH * SB - 10, TITLE_INK, SB, 'center', 1);
    DARK = keepDark;
  }
  // Pause / quit: the world frozen and dimmed, the choices, and this level's
  // password (from level 2 on) so quitting doesn't cost your place.
  function drawPause() {
    var lh = GH * SB;
    ctx.fillStyle = DARK; ctx.globalAlpha = 0.5; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
    bitOut('PAUSED', W >> 1, 30, LIGHT, SH, 'center', 1);
    var rows = pauseRows(), pad = 8, rowH = lh + 8;
    var boxW = textW('> QUIT TO MAIN PAGE', SB) + pad * 2 + 8, boxH = rows.length * rowH - 4 + pad * 2;
    var x = (W - boxW) >> 1, y = 64;
    panel(x, y, boxW, boxH);
    pauseRects = [];
    for (var i = 0; i < rows.length; i++) {
      var rowY = y + pad + i * rowH;
      pauseRects[i] = { x0: x, y0: rowY - 4, x1: x + boxW, y1: rowY - 4 + rowH };
      if (i === pauseSel) {
        ctx.fillStyle = DARK; ctx.fillRect(x + 3, rowY - 3, boxW - 6, rowH - 2);
        bit('> ' + rows[i], x + pad, rowY, LIGHT, SB);
      } else bit('  ' + rows[i], x + pad, rowY, DARK, SB);
    }
    if (level > 1) bitOut('PASSWORD ' + pwShow(encodePassword()), W >> 1, y + boxH + 12, LIGHT, SB, 'center', 1);
    bitOut('ESC RESUME   SPACE PICK', W >> 1, H - lh - 8, LIGHT, SB, 'center', 1);
  }

  // Password entry: the 8 slots up top, the letter grid, the BACK/DEL/OK row,
  // and a message line (empty, or why the code was refused).
  function drawPassword() {
    var lh = GH * SB;
    ctx.fillStyle = DARK; ctx.globalAlpha = 0.5; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
    bitOut('ENTER PASSWORD', W >> 1, 6, LIGHT, SB, 'center', 1);
    var slots = '';
    for (var i = 0; i < 8; i++) { if (i === 4) slots += '-'; slots += i < pwBuf.length ? pwBuf.charAt(i) : '.'; }
    bitOut(slots, W >> 1, 24, LIGHT, SH, 'center', 1);
    var cw = 30, ch = 18, gx = (W - cw * PW_COLS) >> 1, gy = 52;
    var rows = PW_ALPHA.length / PW_COLS;
    panel(gx - 6, gy - 5, cw * PW_COLS + 12, ch * (rows + 1) + 12);
    pwRects = [];
    for (var k = 0; k < PW_ALPHA.length; k++) {
      var cx = gx + (k % PW_COLS) * cw, cy = gy + ((k / PW_COLS) | 0) * ch;
      pwRects[k] = { x0: cx, y0: cy - 2, x1: cx + cw, y1: cy - 2 + ch };
      var on = k === pwCur;
      if (on) { ctx.fillStyle = DARK; ctx.fillRect(cx + 4, cy - 2, cw - 8, ch - 1); }
      bit(PW_ALPHA.charAt(k), cx + (cw >> 1), cy + 1, on ? LIGHT : DARK, SB, 'center');
    }
    var by = gy + rows * ch + 2, bw = (cw * PW_COLS) / PW_BTNS.length;
    for (var b = 0; b < PW_BTNS.length; b++) {
      var bx = gx + b * bw, idx = PW_ALPHA.length + b, onB = idx === pwCur;
      pwRects[idx] = { x0: bx, y0: by - 2, x1: bx + bw, y1: by - 2 + ch };
      if (onB) { ctx.fillStyle = DARK; ctx.fillRect(bx + 4, by - 2, bw - 8, ch - 1); }
      bit(PW_BTNS[b], bx + (bw >> 1), by + 1, onB ? LIGHT : DARK, SB, 'center');
    }
    if (pwMsg) bitOut(pwMsg, W >> 1, H - lh * 2 - 12, LIGHT, SB, 'center', 1);
    bitOut('ARROWS/TAP PICK   ENTER OK', W >> 1, H - lh - 5, LIGHT, SB, 'center', 1);
  }
  // After the stairs: the new level and its password, big, to write down.
  function drawPassNote() {
    var lh = GH * SB;
    ctx.fillStyle = DARK; ctx.globalAlpha = 0.28; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
    var boxW = 260, boxH = 128, x = (W - boxW) >> 1, y = 26;
    panel(x, y, boxW, boxH);
    bit('LEVEL ' + level, W >> 1, y + 10, DARK, SH, 'center');
    bit('YOUR PASSWORD', W >> 1, y + 40, DARK, SB, 'center');
    bit(pwShow(passPop.code), W >> 1, y + 58, DARK, SH, 'center');
    bit('WRITE IT DOWN TO', W >> 1, y + 86, DARK, SB, 'center');
    bit('RETURN HERE LATER', W >> 1, y + 104, DARK, SB, 'center');
    if (performance.now() - passPop.t0 >= VERSE_GUARD)
      bitOut('SPACE/TAP TO CONTINUE', W >> 1, y + boxH + 10, LIGHT, SB, 'center', 1);
  }

  // The start menu over the dimmed first floor: three rows, the highlighted
  // one's hint underneath, and the same footer as every other menu.
  function drawStart() {
    var lh = GH * SB;
    ctx.fillStyle = DARK; ctx.globalAlpha = 0.28; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
    bitOut(debugNote ? 'DEBUG MODE ON' : 'CHOOSE DIFFICULTY', W >> 1, 22, LIGHT, SB, 'center', 1);
    var pad = 8, rowH = lh + 8;
    var boxW = textW('> PASSWORD', SB) + pad * 2 + 8, boxH = START_ROWS.length * rowH - 4 + pad * 2;
    var x = (W - boxW) >> 1, y = 44;
    panel(x, y, boxW, boxH);
    startRects = [];
    for (var i = 0; i < START_ROWS.length; i++) {
      var rowY = y + pad + i * rowH;
      startRects[i] = { x0: x, y0: rowY - 4, x1: x + boxW, y1: rowY - 4 + rowH };
      if (i === startSel) {
        ctx.fillStyle = DARK; ctx.fillRect(x + 3, rowY - 3, boxW - 6, rowH - 2);
        bit('> ' + START_ROWS[i].label, x + pad, rowY, LIGHT, SB);
      } else bit('  ' + START_ROWS[i].label, x + pad, rowY, DARK, SB);
    }
    bitOut(START_ROWS[startSel].hint, W >> 1, y + boxH + 8, LIGHT, SB, 'center', 1);
    bitOut('↑↓ MOVE   TAP/SPACE PICK', W >> 1, H - lh - 8, LIGHT, SB, 'center', 1);
  }

  function heartsStr() {
    var s = '';
    var gap = boss.maxHearts > BOSS_HEARTS ? '' : ' ';   // close up when merchant hearts make it long
    for (var i = 0; i < boss.maxHearts; i++) s += (i < boss.hearts ? '♥' : '♡') + (i < boss.maxHearts - 1 ? gap : '');
    return s;
  }
  // Choosing a head: a small menu on the left, the dragon left clear in the
  // middle, and a ↓ over whichever head the menu has highlighted. Fallen
  // heads are struck from the menu and X'd on the billboard.
  function drawHeads() {
    var lh = GH * SB;
    bitOut('PICK A HEAD', W >> 1, 5, LIGHT, SB, 'center', 1);
    bitOut(heartsStr(), W - 5, 5, LIGHT, SB, 'right', 1);

    var pad = 6, rowH = lh + 4;
    var boxW = textW('> HEAD 5', SB) + pad * 2, boxH = 5 * rowH - 4 + pad * 2;
    var x = 6, y = (H - boxH) >> 1;
    panel(x, y, boxW, boxH);
    boss.rects = [];
    for (var i = 0; i < 5; i++) {
      var rowY = y + pad + i * rowH;
      boss.rects[i] = { x0: x, y0: rowY - 2, x1: x + boxW, y1: rowY - 2 + rowH };
      var label = 'HEAD ' + (i + 1);
      if (!boss.heads[i]) {
        bit('  ' + label, x + pad, rowY, DARK, SB);
        ctx.fillStyle = DARK; ctx.fillRect(x + pad + 2 * GADV * SB, rowY + (lh >> 1) - 1, textW(label, SB), 2);   // struck
      } else if (i === boss.sel) {
        ctx.fillStyle = DARK; ctx.fillRect(x + 3, rowY - 2, boxW - 6, rowH);
        bit('> ' + label, x + pad, rowY, LIGHT, SB);
      } else bit('  ' + label, x + pad, rowY, DARK, SB);
    }

    if (dragonBox) {
      var b = dragonBox, sxs = b.w / DRAGON_W, sys = b.h / DRAGON_H;
      for (var k = 0; k < 5; k++) {
        var hd = DRAGON_HEADS[k];
        if (!boss.heads[k]) {
          bitOut('X', b.left + (hd.cx + 0.5) * sxs, b.top + hd.cy * sys - (GH >> 1), LIGHT, 1, 'center', 1);   // small, so it can't crowd a neighbour's arrow
        } else if (k === boss.sel) {
          var ay = (b.top + hd.ty * sys) - lh - 3;
          bitOut('↓', b.left + (hd.tx + 0.5) * sxs + 1, Math.max(2, ay), LIGHT, SB, 'center', 1);
        }
      }
    }
    bitOut('↑↓ MOVE   TAP/SPACE PICK', W >> 1, H - lh - 5, LIGHT, SB, 'center', 1);
  }

  function bitCount(n) { var c = 0; while (n) { c += n & 1; n >>= 1; } return c; }

  function drawQuiz() {
    var q = quiz.q;
    // Dim the frozen scene a touch so the panel pops.
    ctx.fillStyle = DARK;
    ctx.globalAlpha = 0.28;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;

    var pad = 8, boxW = W - 24, x = 12;
    var lineH = GH * SB + 4;           // question line height
    var rowH = GH * SB + 6;            // answer row height
    var lines = wrapBits(q.q, boxW - pad * 2, SB);
    var boxH = pad + lines.length * lineH + 6 + quiz.order.length * rowH + pad;
    var y = (H - boxH) >> 1;
    if (quiz.merchant) {                 // which tier he's asking, and which chance
      bitOut('MERCHANT - ' + quiz.tier, 5, 5, LIGHT, SB, 'left', 1);
      bitOut('ASK ' + quiz.n + '/' + quiz.of, W - 5, 5, LIGHT, SB, 'right', 1);   // which chance this is
    }
    if (quiz.jester) bitOut(quiz.result ? quiz.note : 'REAL OR FAKE?', W >> 1, 5, LIGHT, SB, 'center', 1);
    if (quiz.boss) {                     // whose question it is, and what you have left
      bitOut('HEAD ' + (quiz.head + 1), 5, 5, LIGHT, SB, 'left', 1);
      bitOut(heartsStr(), W - 5, 5, LIGHT, SB, 'right', 1);
    }
    panel(x, y, boxW, boxH);

    var ty = y + pad;
    for (var i = 0; i < lines.length; i++) { bit(lines[i], x + pad, ty, DARK, SB); ty += lineH; }
    ty += 6;

    quiz.rects = [];                   // per-row tap hit-boxes (canvas space) for touch selection
    for (var r = 0; r < quiz.order.length; r++) {
      var real = quiz.order[r];
      var label = q.a[real];
      var rowY = ty + r * rowH;
      quiz.rects[r] = { x0: x + 4, y0: rowY - 1, x1: x + boxW - 4, y1: rowY - 1 + rowH };
      var selected = (r === quiz.sel);
      var res = quiz.result;
      function bar() { ctx.fillStyle = DARK; ctx.fillRect(x + 4, rowY - 1, boxW - 8, rowH); }
      if (!res) {
        if (selected) { bar(); bit('> ' + label, x + 8, rowY + 2, LIGHT, SB); }
        else bit('  ' + label, x + 8, rowY + 2, DARK, SB);
      } else if (res === 'right') {
        if (real === q.correct) { bar(); bit('> ' + label + ' ✓', x + 8, rowY + 2, LIGHT, SB); }
        else bit('  ' + label, x + 8, rowY + 2, DARK, SB);
      } else {
        // Wrong: reveal NOTHING about the correct answer. Only mark the
        // player's own pick with an X; everything else stays plain.
        if (selected) bit('X ' + label, x + 8, rowY + 2, DARK, SB);
        else bit('  ' + label, x + 8, rowY + 2, DARK, SB);
      }
    }

    // Footer: instructions before answering, result banner after.
    var fy = y + boxH + 8;
    if (!quiz.result) {
      bitOut('↑↓ MOVE   TAP/SPACE PICK', W >> 1, fy, LIGHT, SB, 'center', 1);
    } else {
      bitOut(quiz.reward, W >> 1, fy, LIGHT, SH, 'center', 1);
    }
  }

  // Word-wrap for the question text, by character budget at scale s.
  function wrapBits(str, maxPx, s) {
    var maxChars = Math.max(1, Math.floor((maxPx + s) / (GADV * s)));
    var words = ('' + str).split(' '), lines = [], cur = '';
    for (var i = 0; i < words.length; i++) {
      var test = cur ? cur + ' ' + words[i] : words[i];
      if (test.length > maxChars && cur) { lines.push(cur); cur = words[i]; }
      else cur = test;
    }
    if (cur) lines.push(cur);
    return lines;
  }

  // ── Chest sprite ────────────────────────────────────────────────
  // Drawn in the line-art style: a DARK body with a LIGHT outline picking
  // out lid/latch, plus a DARK halo around the whole silhouette so it never
  // merges into a dark wall behind it. Positioned/sorted by drawSprites; it
  // depth-tests per column against cDist so walls in front occlude it.
  function drawChestSprite(ch, left, top, w, h, depth) {
    function vis(sx) {                 // is this screen column in front of the wall?
      return sx >= 0 && sx < W && depth < cDist[sx];
    }
    function px2(sx, sy, color) {
      if (sx < 0 || sx >= W || sy < 0 || sy >= H) return;
      if (!vis(sx)) return;            // occluded by a nearer wall
      ctx.fillStyle = color;
      ctx.fillRect(sx | 0, sy | 0, 1, 1);
    }
    function rect(x0, y0, ww, hh, color) {
      for (var yy = 0; yy < hh; yy++)
        for (var xx = 0; xx < ww; xx++)
          px2(x0 + xx, y0 + yy, color);
    }
    function hline(x0, y0, ww, color) { for (var xx = 0; xx < ww; xx++) px2(x0 + xx, y0, color); }
    function vlin(x0, y0, hh, color) { for (var yy = 0; yy < hh; yy++) px2(x0, y0 + yy, color); }

    // Mild per-chest variety (style 0/1/2): just enough to tell chests
    // apart without leaving the bitonal look. Style only changes the lid
    // depth, the latch shape, and the band pattern — nothing else.
    var style = ch.style || 0;
    var lidFrac = style === 1 ? 0.28 : (style === 2 ? 0.42 : 0.34);
    var lidH = (h * lidFrac) | 0;      // lid depth varies a touch by style
    var bodyTop = top + lidH;
    var bodyH = h - lidH;

    // 1) DARK halo: fill one pixel bigger all around so the chest reads
    //    against any wall. (Drawn first; body paints over the interior.)
    rect(left - 1, top - 1, w + 2, h + 2, DARK);

    // 2) DARK body fill.
    rect(left, top, w, h, DARK);

    // 3) LIGHT outline of the whole silhouette + the lid seam + a latch.
    hline(left, top, w, LIGHT);                 // lid top
    hline(left, bodyTop, w, LIGHT);             // lid/body seam
    hline(left, top + h - 1, w, LIGHT);         // base
    vlin(left, top, h, LIGHT);                  // left side
    vlin(left + w - 1, top, h, LIGHT);          // right side
    // latch + bands, varied mildly by style.
    var lw = Math.max(2, (w * 0.16) | 0), lx = left + ((w - lw) >> 1);
    if (style === 1) {
      // tall keyhole latch with a dark notch punched in it
      rect(lx, bodyTop - (lidH >> 2), lw, (lidH >> 1) + 4, LIGHT);
      px2(left + (w >> 1), bodyTop + 1, DARK);
      // single center band
      if (w >= 8) vlin(left + (w >> 1), bodyTop, bodyH, LIGHT);
    } else if (style === 2) {
      // small square latch, plus a horizontal strap across the body
      rect(lx + 1, bodyTop - (lidH >> 3), lw - 2, (lidH >> 1), LIGHT);
      if (bodyH >= 6) hline(left, bodyTop + ((bodyH >> 1) | 0), w, LIGHT);
    } else {
      // style 0: the original — square latch + two side bands
      rect(lx, bodyTop - (lidH >> 2), lw, (lidH >> 1) + 2, LIGHT);
      if (w >= 10) {
        vlin(left + ((w * 0.28) | 0), bodyTop, bodyH, LIGHT);
        vlin(left + ((w * 0.72) | 0), bodyTop, bodyH, LIGHT);
      }
    }
  }

  // ── Loop ───────────────────────────────────────────────────────
  var last = 0;
  function frame(now) {
    if (!running) return;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    gameTime += dt;                       // drives the portal shimmer
    if (flash > 0) flash -= dt;           // decay the teleport flash
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  // Start on a random palette. Set START_RANDOM to false to always open on
  // #0 (Cobalt Vellum, the original). Cycle live with [ ] and R.
  var START_RANDOM = true;
  applyPalette(START_RANDOM ? (Math.random() * PALETTES.length) | 0 : 0);

  generateFloor(newSeed());     // build the first floor before the first frame
  render();
})();
</script>
</body>
</html>
